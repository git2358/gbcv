<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Game Boy Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}


body {

    display: flex;

    align-items: center;
    justify-content: center;

}


/*
============================================================
IMAGE VIEWER
============================================================
*/

#photo {

    display: none;

    width: 98vw;
    height: 98vh;

    object-fit: contain;

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    image-rendering: pixelated;
    image-rendering: crisp-edges;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;

}


/*
============================================================
UPLOAD SCREEN
============================================================
*/

#upload {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 15px;

    color: #fff;

    text-align: center;

    font-family: sans-serif;

}


#upload label {

    display: inline-block;

    padding: 14px 22px;

    background: #222;

    border: 1px solid #555;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

}


#upload label:hover {

    background: #333;

}


#file {

    display: none;

}


/*
============================================================
QUALITY SELECTOR
============================================================
*/

#qualityBox {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    font-size: 14px;

}


#quality {

    padding: 5px 8px;

    background: #222;

    color: #fff;

    border: 1px solid #555;

    border-radius: 5px;

}


/*
============================================================
ERROR
============================================================
*/

#error {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    max-width: 90vw;

    padding: 10px 15px;

    background:
        rgba(150, 0, 0, 0.9);

    color: #fff;

    font-family: monospace;

    font-size: 13px;

    border-radius: 6px;

    text-align: center;

    z-index: 10;

}


/*
============================================================
COPIED MESSAGE
============================================================
*/

#copied {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    padding: 10px 15px;

    background:
        rgba(0, 0, 0, 0.85);

    color: #fff;

    font-family: sans-serif;

    font-size: 14px;

    border-radius: 6px;

    z-index: 10;

}

</style>

</head>


<body>


<!--
============================================================
UPLOAD SCREEN
============================================================
-->

<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <div id="qualityBox">

        <span>
            Quality:
        </span>

        <select id="quality">

            <option value="0.90">
                Maximum
            </option>

            <option value="0.80">
                High
            </option>

            <option value="0.70" selected>
                Normal
            </option>

            <option value="0.60">
                Small
            </option>

            <option value="0.50">
                Very Small
            </option>

        </select>

    </div>

    <input
        id="file"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

</div>


<!--
============================================================
IMAGE
============================================================
-->

<img
    id="photo"
    alt="Game Boy Camera Photo"
>


<div id="error"></div>


<div id="copied">
    URL copied!
</div>


<script>


/*
################################################################
#
# GBC2
#
# GAME BOY CAMERA WEBP URL FORMAT
#
################################################################
#
# New URLs:
#
#   #GBC2/<Base64URL WebP>
#
# Pipeline:
#
#   Input image
#       ↓
#   128×112 or 160×144
#       ↓
#   Game Boy Camera 4-shade grayscale
#       ↓
#   WebP
#       ↓
#   Base64URL
#
# The WebP itself is already compressed.
#
# We deliberately DO NOT DEFLATE WebP.
#
################################################################
#
# GBC1 URLs are still supported.
#
# Old PNG/Base64 URLs are also still supported.
#
################################################################
*/


const GBC2_MAGIC =
    "GBC2";


const GBC1_MAGIC =
    "GBC1";


const GBC1_VERSION =
    1;


/*
============================================================
DOM
============================================================
*/

const photo =
    document.getElementById(
        "photo"
    );


const upload =
    document.getElementById(
        "upload"
    );


const fileInput =
    document.getElementById(
        "file"
    );


const qualitySelect =
    document.getElementById(
        "quality"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const copiedBox =
    document.getElementById(
        "copied"
    );


/*
============================================================
ERROR
============================================================
*/

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/*
============================================================
BASE64URL ENCODE
============================================================
*/

function bytesToBase64Url(bytes) {

    let binary = "";

    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );


        binary +=
            String.fromCharCode(
                ...chunk
            );

    }


    return btoa(binary)

        .replace(
            /\+/g,
            "-"
        )

        .replace(
            /\//g,
            "_"
        )

        .replace(
            /=/g,
            ""
        );

}


/*
============================================================
BASE64URL DECODE
============================================================
*/

function base64UrlToBytes(string) {

    let base64 =
        string

            .replace(
                /-/g,
                "+"
            )

            .replace(
                /_/g,
                "/"
            );


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/*
============================================================
CHECK GBC DIMENSIONS
============================================================
*/

function checkDimensions(
    width,
    height
) {

    if (
        !(
            (
                width === 128 &&
                height === 112
            )
            ||
            (
                width === 160 &&
                height === 144
            )
        )
    ) {

        throw new Error(
            "Game Boy Camera images must be " +
            "128×112 or 160×144."
        );

    }

}


/*
============================================================
CONVERT IMAGE TO FOUR GBC SHADES
============================================================
*/

function convertToGBCShades(
    sourceCanvas
) {

    const width =
        sourceCanvas.width;


    const height =
        sourceCanvas.height;


    checkDimensions(
        width,
        height
    );


    const sourceContext =
        sourceCanvas.getContext(
            "2d"
        );


    const source =
        sourceContext.getImageData(
            0,
            0,
            width,
            height
        );


    const outputCanvas =
        document.createElement(
            "canvas"
        );


    outputCanvas.width =
        width;


    outputCanvas.height =
        height;


    const outputContext =
        outputCanvas.getContext(
            "2d"
        );


    const output =
        outputContext.createImageData(
            width,
            height
        );


    /*
     * Four evenly spaced grayscale levels.
     *
     * This preserves the important characteristic
     * of a Game Boy Camera image while throwing away
     * unnecessary RGB colour information.
     */
    const shades = [
        0,
        85,
        170,
        255
    ];


    for (
        let i = 0;
        i < source.data.length;
        i += 4
    ) {

        const r =
            source.data[i];


        const g =
            source.data[i + 1];


        const b =
            source.data[i + 2];


        const a =
            source.data[i + 3];


        /*
         * Standard luminance approximation.
         */
        const luminance =
            (
                0.299 * r +
                0.587 * g +
                0.114 * b
            );


        /*
         * Map to nearest GBC shade.
         */
        let shadeIndex =
            Math.round(
                luminance / 85
            );


        if (
            shadeIndex < 0
        ) {

            shadeIndex = 0;

        }


        if (
            shadeIndex > 3
        ) {

            shadeIndex = 3;

        }


        const shade =
            shades[
                shadeIndex
            ];


        output.data[i] =
            shade;


        output.data[i + 1] =
            shade;


        output.data[i + 2] =
            shade;


        output.data[i + 3] =
            a === 0
                ? 255
                : a;

    }


    outputContext.putImageData(
        output,
        0,
        0
    );


    return outputCanvas;

}


/*
============================================================
CREATE GBC2 WEBP
============================================================
*/

function canvasToWebP(
    canvas,
    quality
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            canvas.toBlob(
                function (blob) {

                    if (!blob) {

                        reject(
                            new Error(
                                "This browser could not create WebP."
                            )
                        );

                        return;

                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function () {

                            resolve(
                                new Uint8Array(
                                    reader.result
                                )
                            );

                        };


                    reader.onerror =
                        function () {

                            reject(
                                new Error(
                                    "Could not read WebP data."
                                )
                            );

                        };


                    reader.readAsArrayBuffer(
                        blob
                    );

                },

                "image/webp",

                quality

            );

        }
    );

}


/*
============================================================
ENCODE GBC2
============================================================
*/

async function encodeGBC2(
    canvas,
    quality
) {

    const gbcCanvas =
        convertToGBCShades(
            canvas
        );


    const webp =
        await canvasToWebP(
            gbcCanvas,
            quality
        );


    /*
     * WebP is already compressed.
     *
     * Do not run DEFLATE over it.
     */
    const encoded =
        bytesToBase64Url(
            webp
        );


    return (
        GBC2_MAGIC +
        "/" +
        encoded
    );

}


/*
============================================================
LOAD GBC2
============================================================
*/

function loadGBC2(
    encoded
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            const base64 =
                encoded.substring(
                    GBC2_MAGIC.length + 1
                );


            if (!base64) {

                reject(
                    new Error(
                        "Empty GBC2 image."
                    )
                );

                return;

            }


            /*
             * Convert back to bytes.
             */
            let bytes;

            try {

                bytes =
                    base64UrlToBytes(
                        base64
                    );

            }
            catch (error) {

                reject(
                    new Error(
                        "Invalid GBC2 Base64 data."
                    )
                );

                return;

            }


            /*
             * Blob lets the browser decode the
             * WebP directly.
             */
            const blob =
                new Blob(
                    [bytes],
                    {
                        type:
                            "image/webp"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            photo.onload =
                function () {

                    URL.revokeObjectURL(
                        url
                    );


                    upload.style.display =
                        "none";


                    photo.style.display =
                        "block";


                    resolve();

                };


            photo.onerror =
                function () {

                    URL.revokeObjectURL(
                        url
                    );


                    reject(
                        new Error(
                            "The GBC2 WebP image could not be decoded."
                        )
                    );

                };


            photo.src =
                url;

        }
    );

}


/*
################################################################
#
# GBC1 DECODER
#
################################################################
*/


/*
============================================================
XOR DECODE
============================================================
*/

function xorDecode(bytes) {

    const output =
        new Uint8Array(
            bytes.length
        );


    let previous =
        0;


    for (
        let i = 0;
        i < bytes.length;
        i++
    ) {

        output[i] =
            bytes[i] ^ previous;


        previous =
            output[i];

    }


    return output;

}


/*
============================================================
RLE DECODE
============================================================
*/

function rleDecode(bytes) {

    const output = [];

    let i = 0;


    while (
        i < bytes.length
    ) {

        const value =
            bytes[i++];


        if (
            value !== 255
        ) {

            output.push(
                value
            );

            continue;

        }


        if (
            i + 1 >= bytes.length
        ) {

            throw new Error(
                "Invalid GBC1 RLE data."
            );

        }


        const marker =
            bytes[i++];


        const count =
            bytes[i++];


        if (
            marker !== 0 ||
            count === 0
        ) {

            throw new Error(
                "Invalid GBC1 RLE sequence."
            );

        }


        if (
            count === 1
        ) {

            output.push(
                255
            );

        }
        else {

            for (
                let n = 0;
                n < count;
                n++
            ) {

                output.push(
                    0
                );

            }

        }

    }


    return new Uint8Array(
        output
    );

}


/*
============================================================
DEFLATE INFLATE
============================================================
*/

async function inflate(bytes) {

    if (
        !(
            "DecompressionStream"
            in window
        )
    ) {

        throw new Error(
            "This browser does not support DEFLATE decompression."
        );

    }


    const stream =
        new Blob(
            [bytes]
        )
        .stream()
        .pipeThrough(
            new DecompressionStream(
                "deflate"
            )
        );


    const buffer =
        await new Response(
            stream
        )
        .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
DECODE GBC1
============================================================
*/

async function decodeGBC1(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC1_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC1 image is too short."
        );

    }


    if (
        raw[0] !==
        GBC1_VERSION
    ) {

        throw new Error(
            "Unsupported GBC1 version."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width = 128;
        height = 112;

    }
    else if (
        dimensionCode === 1
    ) {

        width = 160;
        height = 144;

    }
    else {

        throw new Error(
            "Unsupported GBC1 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    const palette =
        new Uint8Array(
            raw.subarray(
                2,
                14
            )
        );


    let pixelData =
        raw.subarray(
            14
        );


    if (
        codec === 1
    ) {

        pixelData =
            xorDecode(
                pixelData
            );

    }
    else if (
        codec === 2
    ) {

        pixelData =
            xorDecode(
                rleDecode(
                    pixelData
                )
            );

    }
    else if (
        codec !== 0
    ) {

        throw new Error(
            "Unsupported GBC1 codec."
        );

    }


    const expectedLength =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        pixelData.length !==
        expectedLength
    ) {

        throw new Error(
            "Invalid GBC1 pixel data."
        );

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    let pixel =
        0;


    for (
        let i = 0;
        i < pixelData.length;
        i++
    ) {

        const packed =
            pixelData[i];


        for (
            let shift = 6;
            shift >= 0 &&
            pixel <
                width * height;
            shift -= 2
        ) {

            const index =
                (
                    packed >>
                    shift
                ) & 3;


            const paletteOffset =
                index * 3;


            const outputOffset =
                pixel * 4;


            imageData.data[
                outputOffset
            ] =
                palette[
                    paletteOffset
                ];


            imageData.data[
                outputOffset + 1
            ] =
                palette[
                    paletteOffset + 1
                ];


            imageData.data[
                outputOffset + 2
            ] =
                palette[
                    paletteOffset + 2
                ];


            imageData.data[
                outputOffset + 3
            ] =
                255;


            pixel++;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/*
============================================================
LOAD GBC1
============================================================
*/

async function loadGBC1(
    encoded
) {

    const canvas =
        await decodeGBC1(
            encoded
        );


    /*
     * GBC1 needs a temporary PNG for display.
     *
     * It is NOT stored in the URL.
     */
    const url =
        canvas.toDataURL(
            "image/png"
        );


    return loadImageURL(
        url,
        "Could not display GBC1 image."
    );

}


/*
################################################################
#
# LEGACY PNG DECODER
#
################################################################
*/


function loadLegacyPNG(
    encoded
) {

    let base64 =
        encoded
            .replace(
                /-/g,
                "+"
            )
            .replace(
                /_/g,
                "/"
            );


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    return loadImageURL(
        "data:image/png;base64," +
        base64,

        "The image data in this URL could not be decoded."
    );

}


/*
============================================================
COMMON IMAGE LOADER
============================================================
*/

function loadImageURL(
    url,
    errorMessage
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            photo.onload =
                function () {

                    upload.style.display =
                        "none";


                    photo.style.display =
                        "block";


                    resolve();

                };


            photo.onerror =
                function () {

                    upload.style.display =
                        "none";


                    photo.style.display =
                        "none";


                    reject(
                        new Error(
                            errorMessage
                        )
                    );

                };


            photo.src =
                url;

        }
    );

}


/*
################################################################
#
# LOAD IMAGE FROM HASH
#
################################################################
*/

async function loadImageFromHash() {

    const encoded =
        window.location.hash.substring(
            1
        );


    /*
     * No image.
     */
    if (!encoded) {

        upload.style.display =
            "flex";


        photo.style.display =
            "none";


        return;

    }


    errorBox.style.display =
        "none";


    try {

        /*
         * ----------------------------------------------------
         * GBC2
         * ----------------------------------------------------
         */

        if (
            encoded.startsWith(
                GBC2_MAGIC + "/"
            )
        ) {

            await loadGBC2(
                encoded
            );


            return;

        }


        /*
         * ----------------------------------------------------
         * GBC1
         * ----------------------------------------------------
         */

        if (
            encoded.startsWith(
                GBC1_MAGIC + "/"
            )
        ) {

            await loadGBC1(
                encoded
            );


            return;

        }


        /*
         * ----------------------------------------------------
         * OLD PNG BASE64
         * ----------------------------------------------------
         */

        await loadLegacyPNG(
            encoded
        );

    }
    catch (error) {

        console.error(
            error
        );


        upload.style.display =
            "none";


        photo.style.display =
            "none";


        showError(
            error.message ||
            "Invalid image URL."
        );

    }

}


/*
################################################################
#
# UPLOAD / GBC2 ENCODE
#
################################################################
*/

fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files[0];


        if (!file) {

            return;

        }


        errorBox.style.display =
            "none";


        const reader =
            new FileReader();


        reader.onload =
            function () {

                const image =
                    new Image();


                image.onload =
                    async function () {

                        try {

                            /*
                             * ------------------------------------------------
                             * Verify dimensions.
                             * ------------------------------------------------
                             */

                            checkDimensions(
                                image.naturalWidth,
                                image.naturalHeight
                            );


                            /*
                             * ------------------------------------------------
                             * Put original image onto canvas.
                             * ------------------------------------------------
                             */

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                image.naturalWidth;


                            canvas.height =
                                image.naturalHeight;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.imageSmoothingEnabled =
                                false;


                            ctx.drawImage(
                                image,
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );


                            /*
                             * ------------------------------------------------
                             * Get selected WebP quality.
                             * ------------------------------------------------
                             */

                            const quality =
                                Number(
                                    qualitySelect.value
                                );


                            /*
                             * ------------------------------------------------
                             * Encode as GBC2.
                             * ------------------------------------------------
                             */

                            const encoded =
                                await encodeGBC2(
                                    canvas,
                                    quality
                                );


                            /*
                             * ------------------------------------------------
                             * Update URL.
                             *
                             * Setting location.hash causes hashchange,
                             * but we ALSO explicitly load the image below.
                             *
                             * This means there is no refresh required.
                             * ------------------------------------------------
                             */

                            window.location.hash =
                                encoded;


                            await loadImageFromHash();


                            /*
                             * ------------------------------------------------
                             * Display useful size information in console.
                             * ------------------------------------------------
                             */

                            const urlLength =
                                window.location.href.length;


                            console.log(
                                "GBC2 URL length:",
                                urlLength,
                                "characters"
                            );


                            console.log(
                                "GBC2 data length:",
                                encoded.length,
                                "characters"
                            );

                        }
                        catch (error) {

                            console.error(
                                error
                            );


                            showError(
                                error.message ||
                                "Could not encode Game Boy Camera image."
                            );

                        }

                    };


                image.onerror =
                    function () {

                        showError(
                            "Could not read the selected image."
                        );

                    };


                image.src =
                    reader.result;

            };


        reader.onerror =
            function () {

                showError(
                    "Could not read the selected file."
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);


/*
################################################################
#
# BROWSER BACK / FORWARD
#
################################################################
*/

window.addEventListener(
    "hashchange",
    function () {

        loadImageFromHash();

    }
);


/*
################################################################
#
# CLICK IMAGE → COPY URL
#
################################################################
*/

photo.addEventListener(
    "click",
    async function () {

        const url =
            window.location.href;


        try {

            await navigator.clipboard.writeText(
                url
            );


            copiedBox.style.display =
                "block";


            setTimeout(
                function () {

                    copiedBox.style.display =
                        "none";

                },
                1500
            );

        }
        catch (error) {

            /*
             * Older-browser fallback.
             */
            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";


            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    "copy"
                );


                copiedBox.style.display =
                    "block";


                setTimeout(
                    function () {

                        copiedBox.style.display =
                            "none";

                    },
                    1500
                );

            }
            catch (e) {

                showError(
                    "Could not copy URL."
                );

            }


            document.body.removeChild(
                textarea
            );

        }

    }
);

loadImageFromHash();

</script>
