<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Game Boy Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}

body {

    display: flex;

    align-items: center;
    justify-content: center;

}


/*
============================================================
IMAGE
============================================================
*/

#photo {

    display: none;

    width: 98vw;
    height: 98vh;

    object-fit: contain;

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    image-rendering: pixelated;
    image-rendering: crisp-edges;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;

}


/*
============================================================
UPLOAD
============================================================
*/

#upload {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 15px;

    color: #fff;

    text-align: center;

    font-family: sans-serif;

}

#upload label {

    display: inline-block;

    padding: 14px 22px;

    background: #222;

    border: 1px solid #555;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

}

#upload label:hover {

    background: #333;

}

#file {

    display: none;

}


/*
============================================================
STATUS
============================================================
*/

#status {

    position: fixed;

    left: 50%;
    top: 20px;

    transform:
        translateX(-50%);

    max-width: 90vw;

    padding: 9px 14px;

    background:
        rgba(0,0,0,0.85);

    color: #fff;

    font-family: monospace;

    font-size: 12px;

    border-radius: 6px;

    text-align: center;

    display: none;

    z-index: 20;

}


/*
============================================================
ERROR
============================================================
*/

#error {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    max-width: 90vw;

    padding: 10px 15px;

    background:
        rgba(150,0,0,0.9);

    color: white;

    font-family: monospace;

    font-size: 13px;

    border-radius: 6px;

    text-align: center;

    z-index: 30;

}


/*
============================================================
COPIED
============================================================
*/

#copied {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    padding: 10px 15px;

    background:
        rgba(0,0,0,0.85);

    color: white;

    font-family: sans-serif;

    font-size: 14px;

    border-radius: 6px;

    z-index: 20;

}

</style>

</head>


<body>


<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <input
        id="file"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

</div>


<img
    id="photo"
    alt="Game Boy Camera Photo"
>


<div id="status"></div>

<div id="error"></div>

<div id="copied">
    URL copied!
</div>


<script>

/*
################################################################
#
# GBC4
#
# GAME BOY CAMERA DISCORD FORMAT
#
################################################################
#
# GBC4 deliberately uses a different strategy from GBC1/2/3.
#
# GBC1/2/3:
#
#     lossless pixel encoding
#
# GBC4:
#
#     grayscale
#         ↓
#     optional downsampling
#         ↓
#     WebP lossy compression
#         ↓
#     Base64URL
#
#
# The encoder automatically searches for the best image which
# fits inside MAX_URL_LENGTH.
#
################################################################
#
# URL:
#
#     #GBC4/<base64url WebP>
#
################################################################
*/


const GBC1_MAGIC =
    "GBC1";


const GBC2_MAGIC =
    "GBC2";


const GBC3_MAGIC =
    "GBC3";


const GBC4_MAGIC =
    "GBC4";


const GBC4_MAX_URL_LENGTH =
    2000;


/*
============================================================
DOM
============================================================
*/

const photo =
    document.getElementById(
        "photo"
    );


const upload =
    document.getElementById(
        "upload"
    );


const fileInput =
    document.getElementById(
        "file"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const copiedBox =
    document.getElementById(
        "copied"
    );


const statusBox =
    document.getElementById(
        "status"
    );


/*
============================================================
STATUS
============================================================
*/

function showStatus(message) {

    statusBox.textContent =
        message;

    statusBox.style.display =
        "block";

}


function hideStatus() {

    statusBox.style.display =
        "none";

}


/*
============================================================
ERROR
============================================================
*/

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function hideError() {

    errorBox.style.display =
        "none";

}


/*
============================================================
BASE64URL
============================================================
*/

function bytesToBase64Url(bytes) {

    let binary = "";

    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );


        binary +=
            String.fromCharCode(
                ...chunk
            );

    }


    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


/*
============================================================
BASE64URL DECODE
============================================================
*/

function base64UrlToBytes(string) {

    let base64 =
        string
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/*
============================================================
BLOB → BYTES
============================================================
*/

async function blobToBytes(blob) {

    return new Uint8Array(
        await blob.arrayBuffer()
    );

}


/*
============================================================
BLOB → DATA URL
============================================================
*/

function blobToDataURL(blob) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                function() {

                    reject(
                        new Error(
                            "Could not read image data."
                        )
                    );

                };


            reader.readAsDataURL(
                blob
            );

        }
    );

}


/*
============================================================
WEBP SUPPORT
============================================================
*/

function supportsWebP() {

    const canvas =
        document.createElement(
            "canvas"
        );


    if (
        !canvas.toDataURL
    ) {

        return false;

    }


    return canvas
        .toDataURL(
            "image/webp"
        )
        .startsWith(
            "data:image/webp"
        );

}


/*
============================================================
CREATE GBC4 IMAGE
============================================================
*/

function createGBC4Canvas(
    source,
    width,
    height
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
     * Disable interpolation.
     */
    ctx.imageSmoothingEnabled =
        false;


    /*
     * Draw source.
     */
    ctx.drawImage(
        source,
        0,
        0,
        width,
        height
    );


    /*
     * Convert to grayscale.
     *
     * We use luminance rather than simply one
     * RGB channel.
     */
    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        imageData.data;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];


        const g =
            data[i + 1];


        const b =
            data[i + 2];


        /*
         * Standard perceptual luminance.
         */
        const grey =
            Math.round(
                0.299 * r +
                0.587 * g +
                0.114 * b
            );


        data[i] =
            grey;


        data[i + 1] =
            grey;


        data[i + 2] =
            grey;


        data[i + 3] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/*
============================================================
ENCODE WEBP
============================================================
*/

async function encodeWebP(
    canvas,
    quality
) {

    /*
     * Prefer toBlob because it gives us the actual
     * compressed binary size.
     */
    const blob =
        await new Promise(
            function(resolve) {

                canvas.toBlob(
                    resolve,
                    "image/webp",
                    quality
                );

            }
        );


    if (!blob) {

        throw new Error(
            "This browser could not create a WebP image."
        );

    }


    return blob;

}


/*
============================================================
CREATE GBC4 URL
============================================================
*/

async function makeGBC4URL(
    canvas,
    quality
) {

    const blob =
        await encodeWebP(
            canvas,
            quality
        );


    const bytes =
        await blobToBytes(
            blob
        );


    const base64 =
        bytesToBase64Url(
            bytes
        );


    const encoded =
        GBC4_MAGIC +
        "/" +
        base64;


    /*
     * IMPORTANT:
     *
     * Measure the complete URL, not just the payload.
     */
    const completeURL =
        window.location.origin +
        window.location.pathname +
        "#" +
        encoded;


    return {

        encoded,

        url:
            completeURL,

        urlLength:
            completeURL.length,

        compressedBytes:
            blob.size,

        width:
            canvas.width,

        height:
            canvas.height,

        quality

    };

}


/*
============================================================
MAKE RESIZED CANVAS
============================================================
*/

function resizeCanvas(
    source,
    width,
    height
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
     * For downsampling we WANT smoothing.
     *
     * WebP will then compress the photographic
     * structure instead of preserving individual
     * Game Boy dither pixels.
     */
    ctx.imageSmoothingEnabled =
        true;


    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(
        source,
        0,
        0,
        width,
        height
    );


    /*
     * Convert to grayscale after resizing.
     */
    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        imageData.data;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const grey =
            Math.round(
                0.299 * data[i] +
                0.587 * data[i + 1] +
                0.114 * data[i + 2]
            );


        data[i] =
            grey;


        data[i + 1] =
            grey;


        data[i + 2] =
            grey;


        data[i + 3] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/*
============================================================
GBC4 ADAPTIVE ENCODER
============================================================
*/

async function encodeGBC4(
    source,
    sourceWidth,
    sourceHeight
) {

    if (
        !supportsWebP()
    ) {

        throw new Error(
            "This browser does not support WebP."
        );

    }


    /*
     * --------------------------------------------------------
     * TARGET
     * --------------------------------------------------------
     *
     * We want the largest possible image while keeping the
     * COMPLETE URL at or below 2000 characters.
     *
     * The search is ordered from highest quality/resolution
     * to lower quality/resolution.
     */
    const scaleFactors = [

        1.00,
        0.90,
        0.80,
        0.75,
        0.67,
        0.60,
        0.50,
        0.45,
        0.40,
        0.35,
        0.33,
        0.30,
        0.25,
        0.20,
        0.1667,
        0.15,
        0.125

    ];


    /*
     * Higher qualities first.
     *
     * Because we are searching several resolutions,
     * we can afford to use relatively high WebP quality
     * before reducing the resolution.
     */
    const qualities = [

        0.90,
        0.82,
        0.75,
        0.68,
        0.60,
        0.52,
        0.45,
        0.38,
        0.32,
        0.26,
        0.20

    ];


    let best =
        null;


    /*
     * --------------------------------------------------------
     * SEARCH
     * --------------------------------------------------------
     */

    for (
        const scale of scaleFactors
    ) {

        let width =
            Math.max(
                1,
                Math.round(
                    sourceWidth *
                    scale
                )
            );


        let height =
            Math.max(
                1,
                Math.round(
                    sourceHeight *
                    scale
                )
            );


        /*
         * Keep dimensions even.
         */
        width -=
            width % 2;


        height -=
            height % 2;


        if (
            width < 2 ||
            height < 2
        ) {

            continue;

        }


        const canvas =
            resizeCanvas(
                source,
                width,
                height
            );


        for (
            const quality of qualities
        ) {

            const result =
                await makeGBC4URL(
                    canvas,
                    quality
                );


            /*
             * Record the smallest result even if it
             * doesn't meet the target.
             */
            if (
                best === null ||
                result.urlLength <
                    best.urlLength
            ) {

                best =
                    result;

            }


            /*
             * SUCCESS.
             */
            if (
                result.urlLength <=
                GBC4_MAX_URL_LENGTH
            ) {

                /*
                 * We deliberately keep searching through
                 * the quality values for this resolution.
                 *
                 * Once the image fits, lower quality is not
                 * automatically better.
                 *
                 * We want the HIGHEST quality that fits.
                 */
                let bestAtThisResolution =
                    result;


                for (
                    const betterQuality of qualities
                ) {

                    if (
                        betterQuality <=
                        quality
                    ) {

                        continue;

                    }


                    const better =
                        await makeGBC4URL(
                            canvas,
                            betterQuality
                        );


                    if (
                        better.urlLength <=
                        GBC4_MAX_URL_LENGTH
                    ) {

                        if (
                            better.urlLength >
                                bestAtThisResolution.urlLength
                        ) {

                            bestAtThisResolution =
                                better;

                        }

                    }

                }


                /*
                 * This resolution fits.
                 *
                 * Because resolutions are searched from
                 * largest to smallest, this is the largest
                 * resolution we have found that can fit.
                 */
                return bestAtThisResolution;

            }

        }

    }


    /*
     * Nothing fitted.
     *
     * This should only happen for an unusually long
     * page URL or an extremely unusual browser.
     */
    throw new Error(
        "Could not create a GBC4 image below " +
        GBC4_MAX_URL_LENGTH +
        " characters.\n\n" +
        "Smallest result was " +
        (
            best
                ? best.urlLength
                : "unknown"
        ) +
        " characters."
    );

}


/*
============================================================
DISPLAY CANVAS
============================================================
*/

function displayCanvas(
    canvas
) {

    const imageUrl =
        canvas.toDataURL(
            "image/png"
        );


    photo.onload =
        function() {

            upload.style.display =
                "none";

            photo.style.display =
                "block";

        };


    photo.onerror =
        function() {

            upload.style.display =
                "none";

            photo.style.display =
                "none";

            showError(
                "Could not display image."
            );

        };


    photo.src =
        imageUrl;

}


/*
============================================================
DISPLAY BLOB
============================================================
*/

function displayBlob(
    blob
) {

    const url =
        URL.createObjectURL(
            blob
        );


    photo.onload =
        function() {

            upload.style.display =
                "none";

            photo.style.display =
                "block";

            URL.revokeObjectURL(
                url
            );

        };


    photo.onerror =
        function() {

            upload.style.display =
                "none";

            photo.style.display =
                "none";

            URL.revokeObjectURL(
                url
            );

            showError(
                "Could not display GBC4 image."
            );

        };


    photo.src =
        url;

}


/*
============================================================
DECODE GBC4
============================================================
*/

async function loadGBC4(
    encoded
) {

    if (
        !encoded.startsWith(
            GBC4_MAGIC + "/"
        )
    ) {

        throw new Error(
            "Invalid GBC4 image."
        );

    }


    const base64 =
        encoded.substring(
            GBC4_MAGIC.length + 1
        );


    const bytes =
        base64UrlToBytes(
            base64
        );


    /*
     * WebP is self-describing.
     *
     * No custom GBC4 header is required.
     */
    const blob =
        new Blob(
            [bytes],
            {
                type:
                    "image/webp"
            }
        );


    displayBlob(
        blob
    );

}


/*
============================================================
GBC1 DECODER
============================================================
*/

async function loadGBC1(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC1_MAGIC.length + 1
            )
        );


    const stream =
        new Blob([compressed])
            .stream()
            .pipeThrough(
                new DecompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    const raw =
        new Uint8Array(
            buffer
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC1 image is too short."
        );

    }


    if (
        raw[0] !== 1
    ) {

        throw new Error(
            "Unsupported GBC1 version."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width =
            128;

        height =
            112;

    }
    else if (
        dimensionCode === 1
    ) {

        width =
            160;

        height =
            144;

    }
    else {

        throw new Error(
            "Unsupported GBC1 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    const palette =
        raw.subarray(
            2,
            14
        );


    let pixelData =
        raw.subarray(
            14
        );


    /*
     * XOR.
     */
    function xorDecode(
        bytes
    ) {

        const output =
            new Uint8Array(
                bytes.length
            );


        let previous =
            0;


        for (
            let i = 0;
            i < bytes.length;
            i++
        ) {

            output[i] =
                bytes[i] ^
                previous;


            previous =
                output[i];

        }


        return output;

    }


    /*
     * RLE.
     */
    function rleDecode(
        bytes
    ) {

        const output = [];


        let i = 0;


        while (
            i < bytes.length
        ) {

            const value =
                bytes[i++];


            if (
                value !== 255
            ) {

                output.push(
                    value
                );

                continue;

            }


            if (
                i + 1 >=
                bytes.length
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            const marker =
                bytes[i++];


            const count =
                bytes[i++];


            if (
                marker !== 0 ||
                count === 0
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            if (
                count === 1
            ) {

                output.push(
                    255
                );

            }
            else {

                for (
                    let n = 0;
                    n < count;
                    n++
                ) {

                    output.push(
                        0
                    );

                }

            }

        }


        return new Uint8Array(
            output
        );

    }


    if (
        codec === 1
    ) {

        pixelData =
            xorDecode(
                pixelData
            );

    }
    else if (
        codec === 2
    ) {

        pixelData =
            xorDecode(
                rleDecode(
                    pixelData
                )
            );

    }
    else if (
        codec !== 0
    ) {

        throw new Error(
            "Unsupported GBC1 codec."
        );

    }


    const expectedLength =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        pixelData.length !==
        expectedLength
    ) {

        throw new Error(
            "Invalid GBC1 pixel data."
        );

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    let pixel =
        0;


    for (
        let i = 0;
        i < pixelData.length;
        i++
    ) {

        const packed =
            pixelData[i];


        for (
            let shift = 6;
            shift >= 0 &&
            pixel <
                width * height;
            shift -= 2
        ) {

            const shade =
                (
                    packed >>
                    shift
                ) & 3;


            const paletteOffset =
                shade * 3;


            const outputOffset =
                pixel * 4;


            imageData.data[
                outputOffset
            ] =
                palette[
                    paletteOffset
                ];


            imageData.data[
                outputOffset + 1
            ] =
                palette[
                    paletteOffset + 1
                ];


            imageData.data[
                outputOffset + 2
            ] =
                palette[
                    paletteOffset + 2
                ];


            imageData.data[
                outputOffset + 3
            ] =
                255;


            pixel++;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    displayCanvas(
        canvas
    );

}


/*
============================================================
GBC3 DECODER
============================================================
*/

function unpackRow(
    packed,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    for (
        let x = 0;
        x < width;
        x++
    ) {

        const byteIndex =
            Math.floor(
                x / 4
            );


        const shift =
            6 -
            (
                (x % 4) *
                2
            );


        row[x] =
            (
                packed[byteIndex] >>
                shift
            ) & 3;

    }


    return row;

}


function decodeRowRLE(
    bytes,
    offset,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    let x =
        0;


    while (
        x < width
    ) {

        if (
            offset >=
            bytes.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 RLE row."
            );

        }


        const token =
            bytes[offset++];


        const shade =
            token >> 6;


        const count =
            (
                token & 63
            ) + 1;


        if (
            x + count >
            width
        ) {

            throw new Error(
                "GBC3 RLE row exceeds width."
            );

        }


        row.fill(
            shade,
            x,
            x + count
        );


        x += count;

    }


    return {
        row,
        offset
    };

}


async function loadGBC3(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC3_MAGIC.length + 1
            )
        );


    const stream =
        new Blob([compressed])
            .stream()
            .pipeThrough(
                new DecompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    const raw =
        new Uint8Array(
            buffer
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC3 image is too short."
        );

    }


    if (
        raw[0] !== 3
    ) {

        throw new Error(
            "Unsupported GBC3 version."
        );

    }


    const dimensionCode =
        raw[1];


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width =
            128;

        height =
            112;

    }
    else if (
        dimensionCode === 1
    ) {

        width =
            160;

        height =
            144;

    }
    else {

        throw new Error(
            "Unsupported GBC3 dimensions."
        );

    }


    const palette =
        raw.subarray(
            2,
            14
        );


    const pixels =
        new Uint8Array(
            width *
            height
        );


    let offset =
        14;


    let previousRow =
        null;


    for (
        let y = 0;
        y < height;
        y++
    ) {

        if (
            offset >=
            raw.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 image."
            );

        }


        const mode =
            raw[offset++];


        /*
         * RLE.
         */
        if (
            mode === 0
        ) {

            const result =
                decodeRowRLE(
                    raw,
                    offset,
                    width
                );


            offset =
                result.offset;


            pixels.set(
                result.row,
                y * width
            );


            previousRow =
                result.row;

        }


        /*
         * Packed.
         */
        else if (
            mode === 1
        ) {

            const packedLength =
                Math.ceil(
                    width / 4
                );


            if (
                offset +
                packedLength >
                raw.length
            ) {

                throw new Error(
                    "Unexpected end of GBC3 packed row."
                );

            }


            const packed =
                raw.subarray(
                    offset,
                    offset +
                    packedLength
                );


            offset +=
                packedLength;


            const row =
                unpackRow(
                    packed,
                    width
                );


            pixels.set(
                row,
                y * width
            );


            previousRow =
                row;

        }


        /*
         * Repeat.
         */
        else if (
            mode === 2
        ) {

            if (
                previousRow === null
            ) {

                throw new Error(
                    "GBC3 repeat without previous row."
                );

            }


            pixels.set(
                previousRow,
                y * width
            );

        }


        else {

            throw new Error(
                "Unknown GBC3 row mode: " +
                mode
            );

        }

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const shade =
            pixels[i];


        const paletteOffset =
            shade * 3;


        const outputOffset =
            i * 4;


        imageData.data[
            outputOffset
        ] =
            palette[
                paletteOffset
            ];


        imageData.data[
            outputOffset + 1
        ] =
            palette[
                paletteOffset + 1
            ];


        imageData.data[
            outputOffset + 2
        ] =
            palette[
                paletteOffset + 2
            ];


        imageData.data[
            outputOffset + 3
        ] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    displayCanvas(
        canvas
    );

}


/*
============================================================
GBC2
============================================================
*/

async function loadGBC2(
    encoded
) {

    /*
     * GBC2 compatibility loader.
     *
     * GBC2 used the same basic 2-bit image representation
     * but with its own compressed payload.
     *
     * Try the GBC2 stream using the GBC1-compatible
     * decompression structure first.
     */

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC2_MAGIC.length + 1
            )
        );


    let raw;


    try {

        const stream =
            new Blob([compressed])
                .stream()
                .pipeThrough(
                    new DecompressionStream(
                        "deflate"
                    )
                );


        raw =
            new Uint8Array(
                await new Response(stream)
                    .arrayBuffer()
            );

    }
    catch (error) {

        throw new Error(
            "Could not decompress GBC2 image."
        );

    }


    /*
     * Some older GBC2 images may carry a GBC1-style
     * header. Decode that representation when present.
     */
    if (
        raw.length >= 14 &&
        raw[0] === 1
    ) {

        /*
         * Re-use the GBC1 decoder by reconstructing
         * a GBC1 URL from the decompressed payload.
         */
        const reconstructed =
            new Uint8Array(
                raw.length
            );


        reconstructed.set(
            raw
        );


        const canvas =
            await decodeRawGBC1(
                reconstructed
            );


        displayCanvas(
            canvas
        );


        return;

    }


    /*
     * If the older GBC2 payload is not recognized,
     * give a useful compatibility error rather than
     * displaying corrupted data.
     */
    throw new Error(
        "This GBC2 image uses an older GBC2 layout that " +
        "this viewer cannot identify."
    );

}


/*
============================================================
RAW GBC1 DECODER
============================================================
*/

async function decodeRawGBC1(
    raw
) {

    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC1 data is too short."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width =
            128;

        height =
            112;

    }
    else if (
        dimensionCode === 1
    ) {

        width =
            160;

        height =
            144;

    }
    else {

        throw new Error(
            "Unsupported GBC1 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    const palette =
        raw.subarray(
            2,
            14
        );


    let pixelData =
        raw.subarray(
            14
        );


    function xorDecode(
        bytes
    ) {

        const output =
            new Uint8Array(
                bytes.length
            );


        let previous =
            0;


        for (
            let i = 0;
            i < bytes.length;
            i++
        ) {

            output[i] =
                bytes[i] ^
                previous;


            previous =
                output[i];

        }


        return output;

    }


    function rleDecode(
        bytes
    ) {

        const output = [];


        let i =
            0;


        while (
            i < bytes.length
        ) {

            const value =
                bytes[i++];


            if (
                value !== 255
            ) {

                output.push(
                    value
                );

                continue;

            }


            if (
                i + 1 >=
                bytes.length
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            const marker =
                bytes[i++];


            const count =
                bytes[i++];


            if (
                marker !== 0 ||
                count === 0
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            if (
                count === 1
            ) {

                output.push(
                    255
                );

            }
            else {

                for (
                    let n = 0;
                    n < count;
                    n++
                ) {

                    output.push(
                        0
                    );

                }

            }

        }


        return new Uint8Array(
            output
        );

    }


    if (
        codec === 1
    ) {

        pixelData =
            xorDecode(
                pixelData
            );

    }
    else if (
        codec === 2
    ) {

        pixelData =
            xorDecode(
                rleDecode(
                    pixelData
                )
            );

    }


    const expectedLength =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        pixelData.length !==
        expectedLength
    ) {

        throw new Error(
            "Invalid GBC1 pixel data."
        );

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    let pixel =
        0;


    for (
        let i = 0;
        i < pixelData.length;
        i++
    ) {

        const packed =
            pixelData[i];


        for (
            let shift = 6;
            shift >= 0 &&
            pixel <
                width * height;
            shift -= 2
        ) {

            const shade =
                (
                    packed >>
                    shift
                ) & 3;


            const paletteOffset =
                shade * 3;


            const outputOffset =
                pixel * 4;


            imageData.data[
                outputOffset
            ] =
                palette[
                    paletteOffset
                ];


            imageData.data[
                outputOffset + 1
            ] =
                palette[
                    paletteOffset + 1
                ];


            imageData.data[
                outputOffset + 2
            ] =
                palette[
                    paletteOffset + 2
                ];


            imageData.data[
                outputOffset + 3
            ] =
                255;


            pixel++;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/*
============================================================
LEGACY PNG
============================================================
*/

function loadLegacyPNG(
    encoded
) {

    let base64 =
        encoded
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    photo.onload =
        function() {

            upload.style.display =
                "none";

            photo.style.display =
                "block";

        };


    photo.onerror =
        function() {

            upload.style.display =
                "none";

            photo.style.display =
                "none";

            showError(
                "The image data in this URL could not be decoded."
            );

        };


    photo.src =
        "data:image/png;base64," +
        base64;

}


/*
============================================================
LOAD HASH
============================================================
*/

async function loadImageFromHash() {

    const encoded =
        window.location.hash.substring(
            1
        );


    if (!encoded) {

        upload.style.display =
            "flex";

        photo.style.display =
            "none";

        hideStatus();

        return;

    }


    hideError();


    try {

        /*
         * GBC4
         */
        if (
            encoded.startsWith(
                GBC4_MAGIC + "/"
            )
        ) {

            await loadGBC4(
                encoded
            );


            return;

        }


        /*
         * GBC3
         */
        if (
            encoded.startsWith(
                GBC3_MAGIC + "/"
            )
        ) {

            await loadGBC3(
                encoded
            );


            return;

        }


        /*
         * GBC2
         */
        if (
            encoded.startsWith(
                GBC2_MAGIC + "/"
            )
        ) {

            await loadGBC2(
                encoded
            );


            return;

        }


        /*
         * GBC1
         */
        if (
            encoded.startsWith(
                GBC1_MAGIC + "/"
            )
        ) {

            await loadGBC1(
                encoded
            );


            return;

        }


        /*
         * Original PNG/base64 format.
         */
        loadLegacyPNG(
            encoded
        );

    }
    catch (error) {

        console.error(
            error
        );


        upload.style.display =
            "none";

        photo.style.display =
            "none";


        showError(
            error.message ||
            "Invalid image URL."
        );

    }

}


/*
============================================================
UPLOAD
============================================================
*/

fileInput.addEventListener(
    "change",
    function() {

        const file =
            fileInput.files[0];


        if (!file) {

            return;

        }


        hideError();


        const reader =
            new FileReader();


        reader.onload =
            function() {

                const image =
                    new Image();


                image.onload =
                    async function() {

                        try {

                            const width =
                                image.naturalWidth;


                            const height =
                                image.naturalHeight;


                            /*
                             * Game Boy Camera native sizes.
                             */
                            if (
                                !(
                                    (
                                        width === 128 &&
                                        height === 112
                                    )
                                    ||
                                    (
                                        width === 160 &&
                                        height === 144
                                    )
                                )
                            ) {

                                throw new Error(
                                    "Game Boy Camera images must be " +
                                    "128×112 or 160×144 pixels."
                                );

                            }


                            /*
                             * Create a clean source canvas.
                             */
                            const source =
                                document.createElement(
                                    "canvas"
                                );


                            source.width =
                                width;


                            source.height =
                                height;


                            const sourceCtx =
                                source.getContext(
                                    "2d"
                                );


                            sourceCtx.imageSmoothingEnabled =
                                false;


                            sourceCtx.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            /*
                             * Encode using the adaptive GBC4
                             * Discord encoder.
                             */
                            showStatus(
                                "Finding best image under " +
                                GBC4_MAX_URL_LENGTH +
                                " characters..."
                            );


                            const result =
                                await encodeGBC4(
                                    source,
                                    width,
                                    height
                                );


                            /*
                             * Build final hash.
                             */
                            const newHash =
                                "#" +
                                result.encoded;


                            /*
                             * IMPORTANT:
                             *
                             * Setting location.hash creates
                             * the shareable URL without
                             * reloading the page.
                             */
                            window.location.hash =
                                newHash;


                            /*
                             * Display immediately.
                             */
                            await loadImageFromHash();


                            hideStatus();


                            /*
                             * Diagnostics.
                             */
                            console.log(
                                "================================"
                            );


                            console.log(
                                "GBC4 RESULT"
                            );


                            console.log(
                                "================================"
                            );


                            console.log(
                                "Source:",
                                width +
                                "×" +
                                height
                            );


                            console.log(
                                "Encoded:",
                                result.width +
                                "×" +
                                result.height
                            );


                            console.log(
                                "WebP quality:",
                                result.quality
                            );


                            console.log(
                                "WebP bytes:",
                                result.compressedBytes
                            );


                            console.log(
                                "Hash:",
                                result.encoded.length,
                                "characters"
                            );


                            console.log(
                                "Complete URL:",
                                result.urlLength,
                                "characters"
                            );


                            console.log(
                                "Maximum:",
                                GBC4_MAX_URL_LENGTH,
                                "characters"
                            );


                            console.log(
                                "Remaining:",
                                GBC4_MAX_URL_LENGTH -
                                result.urlLength,
                                "characters"
                            );


                            console.log(
                                "URL:",
                                result.url
                            );


                        }
                        catch (error) {

                            console.error(
                                error
                            );


                            hideStatus();


                            showError(
                                error.message ||
                                "Could not encode image."
                            );

                        }

                    };


                image.onerror =
                    function() {

                        showError(
                            "Could not read the selected image."
                        );

                    };


                image.src =
                    reader.result;

            };


        reader.onerror =
            function() {

                showError(
                    "Could not read the selected file."
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);


/*
============================================================
BACK / FORWARD
============================================================
*/

window.addEventListener(
    "hashchange",
    function() {

        loadImageFromHash();

    }
);


/*
============================================================
CLICK IMAGE → COPY URL
============================================================
*/

photo.addEventListener(
    "click",
    async function() {

        const url =
            window.location.href;


        try {

            await navigator.clipboard.writeText(
                url
            );


            copiedBox.style.display =
                "block";


            setTimeout(
                function() {

                    copiedBox.style.display =
                        "none";

                },
                1500
            );

        }
        catch (error) {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";


            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    "copy"
                );


                copiedBox.style.display =
                    "block";


                setTimeout(
                    function() {

                        copiedBox.style.display =
                            "none";

                    },
                    1500
                );

            }
            catch (e) {

                showError(
                    "Could not copy URL."
                );

            }


            document.body.removeChild(
                textarea
            );

        }

    }
);


/*
============================================================
START
============================================================
*/

loadImageFromHash();

</script>
