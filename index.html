<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Game Boy Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}

body {

    display: flex;

    align-items: center;
    justify-content: center;

}


/*
============================================================
IMAGE
============================================================
*/

#photo {

    display: none;

    width: 98vw;
    height: 98vh;

    object-fit: contain;

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    /*
     * Preserve pixel-art appearance where appropriate.
     */
    image-rendering: pixelated;
    image-rendering: crisp-edges;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;

}


/*
============================================================
UPLOAD
============================================================
*/

#upload {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 15px;

    color: #fff;

    text-align: center;

    font-family: sans-serif;

}


#upload label {

    display: inline-block;

    padding: 14px 22px;

    background: #222;

    border: 1px solid #555;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

}


#upload label:hover {

    background: #333;

}


#file {

    display: none;

}


/*
============================================================
ERROR
============================================================
*/

#error {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    max-width: 90vw;

    padding: 10px 15px;

    background:
        rgba(150, 0, 0, 0.9);

    color: white;

    font-family: monospace;

    font-size: 13px;

    border-radius: 6px;

    text-align: center;

    z-index: 10;

}


/*
============================================================
COPIED
============================================================
*/

#copied {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    padding: 10px 15px;

    background:
        rgba(0, 0, 0, 0.85);

    color: white;

    font-family: sans-serif;

    font-size: 14px;

    border-radius: 6px;

    z-index: 10;

}

</style>

</head>


<body>


<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <input
        id="file"
        type="file"
        accept="image/*"
    >

</div>


<img
    id="photo"
    alt="Game Boy Camera Photo"
>


<div id="error"></div>


<div id="copied">
    URL copied!
</div>


<script>

/*
################################################################
#
# GBC5 / IMG
#
# SIMPLE IMAGE-IN-URL FORMAT
#
################################################################
#
# New URLs:
#
#     #IMG/<Base64URL>
#
#
# The image itself is NOT converted into a custom pixel format.
#
# Original:
#
#     dimensions
#     colours
#     alpha
#     detail
#
# are preserved.
#
#
# Encoding:
#
#     Image
#       ↓
#     Lossless WebP
#       ↓
#     Base64URL
#       ↓
#     #IMG/
#
#
# If lossless WebP is unavailable:
#
#     PNG
#       ↓
#     Base64URL
#
#
# There is deliberately NO:
#
#     fixed Game Boy dimensions
#     palette conversion
#     dithering
#     RLE
#     XOR
#     2-bit packing
#     DEFLATE
#     resizing
#
################################################################
#
# Legacy formats are still readable:
#
#     GBC1
#     GBC3
#     old PNG Base64 hashes
#
################################################################
*/


const IMG_MAGIC =
    "IMG";


const GBC1_MAGIC =
    "GBC1";


const GBC3_MAGIC =
    "GBC3";


/*
============================================================
DOM
============================================================
*/

const photo =
    document.getElementById(
        "photo"
    );


const upload =
    document.getElementById(
        "upload"
    );


const fileInput =
    document.getElementById(
        "file"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const copiedBox =
    document.getElementById(
        "copied"
    );


/*
============================================================
ERROR
============================================================
*/

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/*
============================================================
BASE64URL ENCODE
============================================================
*/

function bytesToBase64Url(bytes) {

    let binary = "";

    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const end =
            Math.min(
                i + chunkSize,
                bytes.length
            );


        let chunk = "";

        for (
            let j = i;
            j < end;
            j++
        ) {

            chunk +=
                String.fromCharCode(
                    bytes[j]
                );

        }


        binary +=
            chunk;

    }


    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


/*
============================================================
BASE64URL DECODE
============================================================
*/

function base64UrlToBytes(string) {

    let base64 =
        string
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/*
============================================================
BLOB → UINT8ARRAY
============================================================
*/

async function blobToBytes(blob) {

    const buffer =
        await blob.arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
BYTES → BLOB
============================================================
*/

function bytesToBlob(
    bytes,
    type
) {

    return new Blob(
        [bytes],
        {
            type
        }
    );

}


/*
============================================================
FIND LOSSLESS WEBP SUPPORT
============================================================
*/

async function encodeLosslessWebP(
    canvas
) {

    /*
     * Canvas.toBlob() is asynchronous.
     *
     * We specifically request:
     *
     *     image/webp
     *     quality: 1
     *
     * and use the WebP lossless mode supported
     * by modern browsers.
     */

    const blob =
        await new Promise(
            function (resolve) {

                canvas.toBlob(
                    resolve,
                    "image/webp",
                    1.0
                );

            }
        );


    /*
     * Browser does not support WebP.
     */
    if (
        !blob ||
        blob.type !== "image/webp"
    ) {

        return null;

    }


    return blob;

}


/*
============================================================
PNG FALLBACK
============================================================
*/

async function encodePNG(
    canvas
) {

    const blob =
        await new Promise(
            function (resolve) {

                canvas.toBlob(
                    resolve,
                    "image/png"
                );

            }
        );


    if (!blob) {

        throw new Error(
            "The browser could not create a PNG."
        );

    }


    return blob;

}


/*
============================================================
CREATE IMAGE URL
============================================================
*/

async function encodeIMG(
    image,
    width,
    height
) {

    /*
     * --------------------------------------------------------
     * IMPORTANT
     * --------------------------------------------------------
     *
     * We deliberately preserve the original image.
     *
     * No resizing.
     *
     * No palette conversion.
     *
     * No dithering.
     *
     * No colour reduction.
     *
     * No forced aspect ratio.
     */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
     * Do NOT enable image smoothing.
     *
     * This avoids introducing additional interpolation.
     */
    ctx.imageSmoothingEnabled =
        false;


    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    /*
     * Try lossless WebP first.
     */
    let blob =
        await encodeLosslessWebP(
            canvas
        );


    let format =
        "webp";


    /*
     * PNG fallback.
     */
    if (!blob) {

        blob =
            await encodePNG(
                canvas
            );

        format =
            "png";

    }


    const bytes =
        await blobToBytes(
            blob
        );


    const encoded =
        IMG_MAGIC +
        "/" +
        bytesToBase64Url(
            bytes
        );


    return {

        encoded,

        format,

        width,

        height,

        imageBytes:
            bytes.length,

        urlCharacters:
            encoded.length

    };

}


/*
============================================================
DISPLAY BLOB
============================================================
*/

function displayBlob(
    blob
) {

    const url =
        URL.createObjectURL(
            blob
        );


    /*
     * Release previous object URL after
     * the new image has loaded.
     */
    const oldUrl =
        photo.dataset.objectUrl;


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";


            if (oldUrl) {

                URL.revokeObjectURL(
                    oldUrl
                );

            }

        };


    photo.onerror =
        function () {

            URL.revokeObjectURL(
                url
            );


            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "Could not display image."
            );

        };


    photo.dataset.objectUrl =
        url;


    photo.src =
        url;

}


/*
============================================================
LOAD #IMG
============================================================
*/

async function loadIMG(
    encoded
) {

    const bytes =
        base64UrlToBytes(
            encoded.substring(
                IMG_MAGIC.length + 1
            )
        );


    if (
        bytes.length === 0
    ) {

        throw new Error(
            "IMG image contains no data."
        );

    }


    /*
     * We don't need to know whether it is WebP
     * or PNG before decoding.
     *
     * The browser can identify the image format.
     */
    const blob =
        new Blob(
            [bytes]
        );


    displayBlob(
        blob
    );

}


/*
################################################################
#
# GBC3 DECODER
#
# Kept only for backwards compatibility.
#
################################################################
*/


function packUnused() {
}


/*
============================================================
GBC3 ROW UNPACK
============================================================
*/

function unpackRow(
    packed,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    for (
        let x = 0;
        x < width;
        x++
    ) {

        const byteIndex =
            Math.floor(
                x / 4
            );


        const shift =
            6 -
            (
                (x % 4) *
                2
            );


        row[x] =
            (
                packed[byteIndex] >>
                shift
            ) & 3;

    }


    return row;

}


/*
============================================================
GBC3 RLE DECODE
============================================================
*/

function decodeRowRLE(
    bytes,
    offset,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    let x = 0;


    while (
        x < width
    ) {

        if (
            offset >=
            bytes.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 RLE row."
            );

        }


        const token =
            bytes[offset++];


        const shade =
            token >> 6;


        const count =
            (
                token & 63
            ) + 1;


        if (
            x + count >
            width
        ) {

            throw new Error(
                "GBC3 RLE row exceeds width."
            );

        }


        row.fill(
            shade,
            x,
            x + count
        );


        x += count;

    }


    return {
        row,
        offset
    };

}


/*
============================================================
DEFLATE INFLATE
============================================================
*/

async function inflate(
    bytes
) {

    if (
        !(
            "DecompressionStream"
            in
            window
        )
    ) {

        throw new Error(
            "This browser does not support DEFLATE decompression."
        );

    }


    const stream =
        new Blob(
            [bytes]
        )
        .stream()
        .pipeThrough(
            new DecompressionStream(
                "deflate"
            )
        );


    const buffer =
        await new Response(
            stream
        )
        .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
DISPLAY FOUR-SHADE CANVAS
============================================================
*/

function displayFourShadeCanvas(
    canvas
) {

    const blobPromise =
        new Promise(
            function (resolve) {

                canvas.toBlob(
                    resolve,
                    "image/png"
                );

            }
        );


    blobPromise.then(
        function (blob) {

            if (!blob) {

                throw new Error(
                    "Could not create display image."
                );

            }


            displayBlob(
                blob
            );

        }
    );

}


/*
============================================================
GBC3 DECODER
============================================================
*/

async function decodeGBC3(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC3_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC3 image is too short."
        );

    }


    if (
        raw[0] !== 3
    ) {

        throw new Error(
            "Unsupported GBC3 version."
        );

    }


    const dimensionCode =
        raw[1];


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width = 128;
        height = 112;

    }
    else if (
        dimensionCode === 1
    ) {

        width = 160;
        height = 144;

    }
    else {

        throw new Error(
            "Unsupported GBC3 dimensions."
        );

    }


    const palette =
        raw.subarray(
            2,
            14
        );


    const pixels =
        new Uint8Array(
            width *
            height
        );


    let offset =
        14;


    let previousRow =
        null;


    for (
        let y = 0;
        y < height;
        y++
    ) {

        if (
            offset >=
            raw.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 image."
            );

        }


        const mode =
            raw[offset++];


        if (
            mode === 0
        ) {

            const result =
                decodeRowRLE(
                    raw,
                    offset,
                    width
                );


            offset =
                result.offset;


            pixels.set(
                result.row,
                y * width
            );


            previousRow =
                result.row;

        }


        else if (
            mode === 1
        ) {

            const packedLength =
                Math.ceil(
                    width / 4
                );


            if (
                offset +
                packedLength >
                raw.length
            ) {

                throw new Error(
                    "Unexpected end of packed GBC3 row."
                );

            }


            const packed =
                raw.subarray(
                    offset,
                    offset +
                    packedLength
                );


            offset +=
                packedLength;


            const row =
                unpackRow(
                    packed,
                    width
                );


            pixels.set(
                row,
                y * width
            );


            previousRow =
                row;

        }


        else if (
            mode === 2
        ) {

            if (
                previousRow === null
            ) {

                throw new Error(
                    "Invalid GBC3 repeat row."
                );

            }


            pixels.set(
                previousRow,
                y * width
            );

        }


        else {

            throw new Error(
                "Unknown GBC3 row mode."
            );

        }

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const shade =
            pixels[i];


        const paletteOffset =
            shade * 3;


        const outputOffset =
            i * 4;


        imageData.data[
            outputOffset
        ] =
            palette[
                paletteOffset
            ];


        imageData.data[
            outputOffset + 1
        ] =
            palette[
                paletteOffset + 1
            ];


        imageData.data[
            outputOffset + 2
        ] =
            palette[
                paletteOffset + 2
            ];


        imageData.data[
            outputOffset + 3
        ] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    displayFourShadeCanvas(
        canvas
    );

}


/*
################################################################
#
# GBC1 DECODER
#
################################################################
*/


async function decodeGBC1(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC1_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC1 image is too short."
        );

    }


    if (
        raw[0] !== 1
    ) {

        throw new Error(
            "Unsupported GBC1 version."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width = 128;
        height = 112;

    }
    else if (
        dimensionCode === 1
    ) {

        width = 160;
        height = 144;

    }
    else {

        throw new Error(
            "Unsupported GBC1 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    const palette =
        raw.subarray(
            2,
            14
        );


    let pixelData =
        raw.subarray(
            14
        );


    /*
     * XOR decoder.
     */
    function xorDecode(
        bytes
    ) {

        const output =
            new Uint8Array(
                bytes.length
            );


        let previous =
            0;


        for (
            let i = 0;
            i < bytes.length;
            i++
        ) {

            output[i] =
                bytes[i] ^
                previous;


            previous =
                output[i];

        }


        return output;

    }


    /*
     * RLE decoder.
     */
    function rleDecode(
        bytes
    ) {

        const output = [];


        let i = 0;


        while (
            i < bytes.length
        ) {

            const value =
                bytes[i++];


            if (
                value !== 255
            ) {

                output.push(
                    value
                );


                continue;

            }


            if (
                i + 1 >=
                bytes.length
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            const marker =
                bytes[i++];


            const count =
                bytes[i++];


            if (
                marker !== 0 ||
                count === 0
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            if (
                count === 1
            ) {

                output.push(
                    255
                );

            }
            else {

                for (
                    let n = 0;
                    n < count;
                    n++
                ) {

                    output.push(
                        0
                    );

                }

            }

        }


        return new Uint8Array(
            output
        );

    }


    if (
        codec === 1
    ) {

        pixelData =
            xorDecode(
                pixelData
            );

    }


    else if (
        codec === 2
    ) {

        pixelData =
            xorDecode(
                rleDecode(
                    pixelData
                )
            );

    }


    else if (
        codec !== 0
    ) {

        throw new Error(
            "Unsupported GBC1 codec."
        );

    }


    const expectedLength =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        pixelData.length !==
        expectedLength
    ) {

        throw new Error(
            "Invalid GBC1 pixel data."
        );

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    let pixel =
        0;


    for (
        let i = 0;
        i < pixelData.length;
        i++
    ) {

        const packed =
            pixelData[i];


        for (
            let shift = 6;
            shift >= 0 &&
            pixel <
                width * height;
            shift -= 2
        ) {

            const shade =
                (
                    packed >>
                    shift
                ) & 3;


            const paletteOffset =
                shade * 3;


            const outputOffset =
                pixel * 4;


            imageData.data[
                outputOffset
            ] =
                palette[
                    paletteOffset
                ];


            imageData.data[
                outputOffset + 1
            ] =
                palette[
                    paletteOffset + 1
                ];


            imageData.data[
                outputOffset + 2
            ] =
                palette[
                    paletteOffset + 2
                ];


            imageData.data[
                outputOffset + 3
            ] =
                255;


            pixel++;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    displayFourShadeCanvas(
        canvas
    );

}


/*
============================================================
OLD PNG BASE64
============================================================
*/

function loadLegacyPNG(
    encoded
) {

    let base64 =
        encoded
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "The image data in this URL could not be decoded."
            );

        };


    photo.src =
        "data:image/png;base64," +
        base64;

}


/*
============================================================
LOAD HASH
============================================================
*/

async function loadImageFromHash() {

    const encoded =
        window.location.hash.substring(
            1
        );


    /*
     * No image.
     */
    if (!encoded) {

        upload.style.display =
            "flex";


        photo.style.display =
            "none";


        return;

    }


    errorBox.style.display =
        "none";


    try {

        /*
         * New simple format.
         */
        if (
            encoded.startsWith(
                IMG_MAGIC + "/"
            )
        ) {

            await loadIMG(
                encoded
            );


            return;

        }


        /*
         * GBC3 compatibility.
         */
        if (
            encoded.startsWith(
                GBC3_MAGIC + "/"
            )
        ) {

            await decodeGBC3(
                encoded
            );


            return;

        }


        /*
         * GBC1 compatibility.
         */
        if (
            encoded.startsWith(
                GBC1_MAGIC + "/"
            )
        ) {

            await decodeGBC1(
                encoded
            );


            return;

        }


        /*
         * Original PNG/Base64 format.
         */
        loadLegacyPNG(
            encoded
        );

    }
    catch (error) {

        console.error(
            error
        );


        upload.style.display =
            "none";


        photo.style.display =
            "none";


        showError(
            error.message ||
            "Invalid image URL."
        );

    }

}


/*
============================================================
UPLOAD
============================================================
*/

fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files[0];


        if (!file) {

            return;

        }


        errorBox.style.display =
            "none";


        const reader =
            new FileReader();


        reader.onload =
            function () {

                const image =
                    new Image();


                image.onload =
                    async function () {

                        try {

                            const result =
                                await encodeIMG(
                                    image,
                                    image.naturalWidth,
                                    image.naturalHeight
                                );


                            /*
                             * Put encoded image in URL.
                             */
                            window.location.hash =
                                result.encoded;


                            /*
                             * Immediately display it.
                             */
                            await loadImageFromHash();


                            /*
                             * Diagnostics.
                             */
                            console.log(
                                "=============================="
                            );


                            console.log(
                                "IMG FORMAT"
                            );


                            console.log(
                                "=============================="
                            );


                            console.log(
                                "Format:",
                                result.format
                            );


                            console.log(
                                "Dimensions:",
                                result.width +
                                " × " +
                                result.height
                            );


                            console.log(
                                "Image bytes:",
                                result.imageBytes
                            );


                            console.log(
                                "Hash characters:",
                                result.urlCharacters
                            );


                            console.log(
                                "Complete URL:",
                                window.location.href.length
                            );


                            console.log(
                                "URL:",
                                window.location.href
                            );


                            console.log(
                                "=============================="
                            );

                        }
                        catch (error) {

                            console.error(
                                error
                            );


                            showError(
                                error.message ||
                                "Could not encode image."
                            );

                        }

                    };


                image.onerror =
                    function () {

                        showError(
                            "Could not read the selected image."
                        );

                    };


                image.src =
                    reader.result;

            };


        reader.onerror =
            function () {

                showError(
                    "Could not read the selected file."
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);


/*
============================================================
BACK / FORWARD
============================================================
*/

window.addEventListener(
    "hashchange",
    function () {

        loadImageFromHash();

    }
);


/*
============================================================
COPY URL
============================================================
*/

photo.addEventListener(
    "click",
    async function () {

        const url =
            window.location.href;


        try {

            await navigator.clipboard.writeText(
                url
            );


            copiedBox.style.display =
                "block";


            setTimeout(
                function () {

                    copiedBox.style.display =
                        "none";

                },
                1500
            );

        }
        catch (error) {

            /*
             * Fallback for browsers where
             * Clipboard API is unavailable.
             */

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";


            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    "copy"
                );


                copiedBox.style.display =
                    "block";


                setTimeout(
                    function () {

                        copiedBox.style.display =
                            "none";

                    },
                    1500
                );

            }
            catch (e) {

                showError(
                    "Could not copy URL."
                );

            }


            document.body.removeChild(
                textarea
            );

        }

    }
);


/*
============================================================
START
============================================================
*/

loadImageFromHash();

</script>
