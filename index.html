<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Game Boy Camera Viewer</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Image viewer */
    #photo {
        display: none;

        max-width: 100vw;
        max-height: 100vh;

        width: auto;
        height: auto;

        object-fit: contain;

        /*
         * CRITICAL FOR GAME BOY CAMERA:
         *
         * Prevent smoothing when the tiny image
         * is enlarged to fill the screen.
         */
        image-rendering: pixelated;
        image-rendering: crisp-edges;

        cursor: pointer;

        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
    }

    /* Upload screen */
    #upload {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        gap: 15px;

        color: #fff;

        text-align: center;
    }

    #upload label {
        display: inline-block;

        padding: 14px 22px;

        background: #222;
        border: 1px solid #555;
        border-radius: 8px;

        font-family: sans-serif;
        font-size: 16px;

        cursor: pointer;
    }

    #upload label:hover {
        background: #333;
    }

    #file {
        display: none;
    }

    #error {
        display: none;

        position: fixed;

        left: 50%;
        bottom: 20px;

        transform: translateX(-50%);

        max-width: 90vw;

        padding: 10px 15px;

        background: rgba(150, 0, 0, 0.9);

        color: white;

        font-family: monospace;
        font-size: 13px;

        border-radius: 6px;

        text-align: center;
    }

    #copied {
        display: none;

        position: fixed;

        left: 50%;
        bottom: 20px;

        transform: translateX(-50%);

        padding: 10px 15px;

        background: rgba(0, 0, 0, 0.85);

        color: white;

        font-family: sans-serif;
        font-size: 14px;

        border-radius: 6px;
    }
</style>
</head>

<body>

<!-- Upload screen -->
<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <input
        id="file"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

</div>


<!-- Image -->
<img
    id="photo"
    alt="Game Boy Camera Photo"
>


<div id="error"></div>

<div id="copied">
    URL copied!
</div>


<script>

const photo = document.getElementById("photo");
const upload = document.getElementById("upload");
const fileInput = document.getElementById("file");
const errorBox = document.getElementById("error");
const copiedBox = document.getElementById("copied");


/*
============================================================
BASE64 URL-SAFE ENCODING
============================================================
*/

function makeUrlSafe(base64) {

    return base64
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");
}


function makeNormalBase64(base64) {

    base64 = base64
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    /*
     * Base64 length must be divisible by 4.
     */
    while (base64.length % 4 !== 0) {
        base64 += "=";
    }

    return base64;
}


/*
============================================================
SHOW ERROR
============================================================
*/

function showError(message) {

    errorBox.textContent = message;
    errorBox.style.display = "block";
}


/*
============================================================
LOAD IMAGE FROM URL
============================================================
*/

function loadImageFromHash() {

    /*
     * Everything after #.
     */
    const encoded = window.location.hash.substring(1);

    /*
     * No image in URL.
     *
     * Show uploader.
     */
    if (!encoded) {

        upload.style.display = "flex";
        photo.style.display = "none";

        return;
    }


    try {

        /*
         * Convert URL-safe Base64 back into
         * normal Base64.
         */
        const base64 = makeNormalBase64(encoded);


        /*
         * IMPORTANT:
         *
         * Don't create a Blob.
         *
         * Directly create the PNG data URL.
         *
         * This is much simpler and works reliably
         * with the long hash URLs used here.
         */
        const imageUrl =
            "data:image/png;base64," +
            base64;


        /*
         * Wait until the image has actually decoded.
         */
        photo.onload = function () {

            upload.style.display = "none";

            photo.style.display = "block";

        };


        photo.onerror = function () {

            upload.style.display = "none";

            photo.style.display = "none";

            showError(
                "The image data in this URL could not be decoded."
            );

        };


        /*
         * Start loading the image.
         */
        photo.src = imageUrl;

    }
    catch (error) {

        console.error(error);

        showError(
            "Invalid image URL."
        );

    }
}


/*
============================================================
UPLOAD IMAGE
============================================================
*/

fileInput.addEventListener("change", function () {

    const file = fileInput.files[0];

    if (!file) {
        return;
    }


    const reader = new FileReader();


    reader.onload = function () {

        const image = new Image();


        image.onload = function () {

            /*
             * Canvas is used to convert the uploaded image
             * to PNG.
             *
             * Original dimensions are preserved.
             */
            const canvas =
                document.createElement("canvas");


            canvas.width =
                image.naturalWidth;

            canvas.height =
                image.naturalHeight;


            const ctx =
                canvas.getContext("2d");


            /*
             * Disable interpolation.
             */
            ctx.imageSmoothingEnabled = false;


            ctx.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * PNG preserves Game Boy Camera pixels
             * without JPEG compression artifacts.
             */
            const png =
                canvas.toDataURL("image/png");


            /*
             * Remove:
             *
             * data:image/png;base64,
             */
            const base64 =
                png.substring(
                    "data:image/png;base64,".length
                );


            /*
             * Make Base64 safe to put inside a URL.
             */
            const encoded =
                makeUrlSafe(base64);


            /*
             * Build the shareable URL.
             *
             * The image is stored entirely after #.
             */
            const url =
                window.location.origin +
                window.location.pathname +
                "#" +
                encoded;


            /*
             * Navigate to it in the SAME window.
             */
            window.location.href = url;

        };


        image.onerror = function () {

            showError(
                "Could not read the selected image."
            );

        };


        image.src = reader.result;

    };


    reader.onerror = function () {

        showError(
            "Could not read the selected file."
        );

    };


    reader.readAsDataURL(file);

});


/*
============================================================
CLICK IMAGE → COPY URL
============================================================
*/

photo.addEventListener("click", async function () {

    const url =
        window.location.href;


    try {

        await navigator.clipboard.writeText(url);

        copiedBox.style.display = "block";


        setTimeout(function () {

            copiedBox.style.display = "none";

        }, 1500);

    }
    catch (error) {

        /*
         * Fallback for browsers where the Clipboard API
         * isn't available.
         */
        const textarea =
            document.createElement("textarea");


        textarea.value = url;

        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";


        document.body.appendChild(textarea);

        textarea.select();


        try {

            document.execCommand("copy");

            copiedBox.style.display = "block";


            setTimeout(function () {

                copiedBox.style.display = "none";

            }, 1500);

        }
        catch (e) {

            showError(
                "Could not copy URL."
            );

        }


        document.body.removeChild(textarea);

    }

});


/*
============================================================
START
============================================================
*/

loadImageFromHash();

</script>

</body>
</html>
