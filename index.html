<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Game Boy Camera Viewer</title>

<script>
const d=new Date(),s=String(d.getFullYear()+d.getMonth()+1+d.getDate()+d.getHours()+d.getMinutes()+d.getSeconds()+d.getMilliseconds()),id=crypto.randomUUID().replaceAll('-',''),v=(s+id).slice(0,32);
document.write('<link rel="stylesheet" href="style.css?v='+v+'">');
</script>

</head>


<body>


<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <input
        id="file"
        type="file"
        accept="image/*"
    >

</div>


<img
    id="photo"
    alt="Game Boy Camera Photo"
>


<div id="error"></div>


<div id="copied">
    URL copied!
</div>


<div class="version"></div>


<script>
document.querySelector('.version').textContent=v;
document.write('<script src="script.js?v='+v+'"><\/script>');
</script>


</body>

</html>
