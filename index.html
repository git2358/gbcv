<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Game Boy Camera Viewer</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}


body {

    display: flex;

    align-items: center;
    justify-content: center;

}


/*
============================================================
IMAGE VIEWER
============================================================
*/

#photo {

    display: none;

    width: 98vw;
    height: 98vh;

    object-fit: contain;

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    /*
     * Preserve the individual Game Boy pixels.
     */
    image-rendering: pixelated;
    image-rendering: crisp-edges;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;

}


/*
============================================================
UPLOAD SCREEN
============================================================
*/

#upload {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 15px;

    color: #fff;

    text-align: center;

}


#upload label {

    display: inline-block;

    padding: 14px 22px;

    background: #222;

    border: 1px solid #555;

    border-radius: 8px;

    font-family: sans-serif;

    font-size: 16px;

    cursor: pointer;

}


#upload label:hover {

    background: #333;

}


#file {

    display: none;

}


/*
============================================================
ERROR
============================================================
*/

#error {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    max-width: 90vw;

    padding: 10px 15px;

    background:
        rgba(150, 0, 0, 0.9);

    color: white;

    font-family: monospace;

    font-size: 13px;

    border-radius: 6px;

    text-align: center;

    z-index: 10;

}


/*
============================================================
COPIED MESSAGE
============================================================
*/

#copied {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    padding: 10px 15px;

    background:
        rgba(0, 0, 0, 0.85);

    color: white;

    font-family: sans-serif;

    font-size: 14px;

    border-radius: 6px;

    z-index: 10;

}

</style>

</head>


<body>


<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <input
        id="file"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

</div>


<img
    id="photo"
    alt="Game Boy Camera Photo"
>


<div id="error"></div>


<div id="copied">
    URL copied!
</div>


<script>


/*
################################################################
#
# GBC2
#
# GAME BOY CAMERA COMPACT URL FORMAT
#
################################################################
#
# URL:
#
#   #GBC2/<Base64URL>
#
#
# IMAGE DATA:
#
#   4 colours
#       ↓
#   2-bit pixels
#       ↓
#   row-by-row adaptive encoding
#       ↓
#   RLE OR packed pixels per row
#       ↓
#   DEFLATE candidate
#       ↓
#   smallest representation selected
#       ↓
#   Base64URL
#
################################################################
#
# GBC2 HEADER
#
# byte 0
#   version = 2
#
# byte 1
#   bits 0-1:
#       dimensions
#
#       0 = 128 × 112
#       1 = 160 × 144
#
#   bits 2-3:
#       codec
#
#       0 = adaptive rows
#       1 = DEFLATE(adaptive rows)
#       2 = packed pixels
#       3 = DEFLATE(packed pixels)
#
# byte 2-13
#   4 × RGB palette
#
# remaining bytes
#   image data
#
################################################################
#
# ADAPTIVE ROW FORMAT
#
# After the 14-byte header:
#
#   mode bitmap
#       1 bit per row
#
#       0 = RLE row
#       1 = packed row
#
#   row data
#
#
# RLE BYTE:
#
#   bits 7-6 = shade
#   bits 5-0 = run length - 1
#
# Therefore:
#
#   00xxxxxx = shade 0
#   01xxxxxx = shade 1
#   10xxxxxx = shade 2
#   11xxxxxx = shade 3
#
# Maximum run = 64 pixels.
#
################################################################
*/


const GBC_MAGIC =
    "GBC2";


const GBC_VERSION =
    2;


/*
============================================================
DOM
============================================================
*/

const photo =
    document.getElementById(
        "photo"
    );


const upload =
    document.getElementById(
        "upload"
    );


const fileInput =
    document.getElementById(
        "file"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const copiedBox =
    document.getElementById(
        "copied"
    );


/*
============================================================
SHOW ERROR
============================================================
*/

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/*
============================================================
BASE64URL ENCODE
============================================================
*/

function bytesToBase64Url(bytes) {

    let binary = "";

    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );


        binary +=
            String.fromCharCode(
                ...chunk
            );

    }


    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


/*
============================================================
BASE64URL DECODE
============================================================
*/

function base64UrlToBytes(string) {

    let base64 =
        string
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/*
============================================================
DEFLATE
============================================================
*/

async function deflate(bytes) {

    if (
        !("CompressionStream" in window)
    ) {

        throw new Error(
            "This browser does not support compression."
        );

    }


    const stream =
        new Blob([bytes])
            .stream()
            .pipeThrough(
                new CompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
INFLATE
============================================================
*/

async function inflate(bytes) {

    if (
        !("DecompressionStream" in window)
    ) {

        throw new Error(
            "This browser does not support decompression."
        );

    }


    const stream =
        new Blob([bytes])
            .stream()
            .pipeThrough(
                new DecompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
GET DIMENSIONS
============================================================
*/

function getDimensions(
    width,
    height
) {

    if (
        width === 128 &&
        height === 112
    ) {

        return 0;

    }


    if (
        width === 160 &&
        height === 144
    ) {

        return 1;

    }


    throw new Error(
        "Game Boy Camera images must be " +
        "128×112 or 160×144."
    );

}


/*
============================================================
PACK ENTIRE IMAGE
============================================================
*/

function packPixels(
    pixelIndexes,
    width,
    height
) {

    const packed =
        new Uint8Array(
            Math.ceil(
                pixelIndexes.length / 4
            )
        );


    let outputIndex =
        0;


    for (
        let i = 0;
        i < pixelIndexes.length;
        i += 4
    ) {

        let value =
            pixelIndexes[i] << 6;


        if (
            i + 1 <
            pixelIndexes.length
        ) {

            value |=
                pixelIndexes[i + 1] << 4;

        }


        if (
            i + 2 <
            pixelIndexes.length
        ) {

            value |=
                pixelIndexes[i + 2] << 2;

        }


        if (
            i + 3 <
            pixelIndexes.length
        ) {

            value |=
                pixelIndexes[i + 3];

        }


        packed[
            outputIndex++
        ] =
            value;

    }


    return packed;

}


/*
============================================================
PACK ONE ROW
============================================================
*/

function packRow(
    row
) {

    const packed =
        new Uint8Array(
            Math.ceil(
                row.length / 4
            )
        );


    let outputIndex =
        0;


    for (
        let i = 0;
        i < row.length;
        i += 4
    ) {

        let value =
            row[i] << 6;


        if (
            i + 1 <
            row.length
        ) {

            value |=
                row[i + 1] << 4;

        }


        if (
            i + 2 <
            row.length
        ) {

            value |=
                row[i + 2] << 2;

        }


        if (
            i + 3 <
            row.length
        ) {

            value |=
                row[i + 3];

        }


        packed[
            outputIndex++
        ] =
            value;

    }


    return packed;

}


/*
============================================================
RLE ONE ROW
============================================================
*/

function rleRow(row) {

    const output = [];


    let i =
        0;


    while (
        i < row.length
    ) {

        const shade =
            row[i];


        let count =
            1;


        while (
            i + count <
                row.length &&
            row[
                i + count
            ] === shade &&
            count < 64
        ) {

            count++;

        }


        /*
         * One byte:
         *
         * top 2 bits = shade
         * bottom 6 bits = count - 1
         */
        output.push(
            (
                shade << 6
            ) |
            (
                count - 1
            )
        );


        i +=
            count;

    }


    return new Uint8Array(
        output
    );

}


/*
============================================================
CREATE ADAPTIVE ROW DATA
============================================================
*/

function createAdaptiveRows(
    pixelIndexes,
    width,
    height
) {

    /*
     * One bit per row.
     *
     * 0 = RLE
     * 1 = packed
     */
    const modeBytes =
        Math.ceil(
            height / 8
        );


    const modeBitmap =
        new Uint8Array(
            modeBytes
        );


    const rowData = [];


    let totalLength =
        modeBytes;


    for (
        let y = 0;
        y < height;
        y++
    ) {

        const row =
            pixelIndexes.subarray(
                y * width,
                (y + 1) * width
            );


        const rle =
            rleRow(
                row
            );


        const packed =
            packRow(
                row
            );


        /*
         * Pick the smaller representation
         * for THIS ROW.
         */
        if (
            packed.length <
            rle.length
        ) {

            modeBitmap[
                Math.floor(y / 8)
            ] |=
                1 <<
                (y % 8);


            rowData.push(
                packed
            );


            totalLength +=
                packed.length;

        }
        else {

            rowData.push(
                rle
            );


            totalLength +=
                rle.length;

        }

    }


    const result =
        new Uint8Array(
            totalLength
        );


    result.set(
        modeBitmap,
        0
    );


    let offset =
        modeBytes;


    for (
        const row of rowData
    ) {

        result.set(
            row,
            offset
        );


        offset +=
            row.length;

    }


    return result;

}


/*
============================================================
CREATE HEADER
============================================================
*/

function createHeader(
    width,
    height,
    palette,
    codec
) {

    const dimensionCode =
        getDimensions(
            width,
            height
        );


    const flags =
        dimensionCode |
        (
            codec << 2
        );


    const header =
        new Uint8Array(
            14
        );


    header[0] =
        GBC_VERSION;


    header[1] =
        flags;


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const colour =
            palette[i];


        const offset =
            2 +
            i * 3;


        header[offset] =
            (
                colour >> 16
            ) & 255;


        header[offset + 1] =
            (
                colour >> 8
            ) & 255;


        header[offset + 2] =
            colour & 255;

    }


    return header;

}


/*
============================================================
BUILD COMPLETE GBC2 DATA
============================================================
*/

function combine(
    header,
    data
) {

    const result =
        new Uint8Array(
            header.length +
            data.length
        );


    result.set(
        header,
        0
    );


    result.set(
        data,
        header.length
    );


    return result;

}


/*
============================================================
CREATE GBC2 ENCODING
============================================================
*/

async function encodeGBC2(
    imageData,
    width,
    height
) {

    getDimensions(
        width,
        height
    );


    const rgba =
        imageData.data;


    /*
     * Find unique colours.
     */
    const frequency =
        new Map();


    for (
        let i = 0;
        i < rgba.length;
        i += 4
    ) {

        if (
            rgba[i + 3] !== 255
        ) {

            throw new Error(
                "Image contains transparency."
            );

        }


        const colour =
            (
                rgba[i] << 16
            ) |
            (
                rgba[i + 1] << 8
            ) |
            rgba[i + 2];


        frequency.set(
            colour,
            (
                frequency.get(
                    colour
                ) || 0
            ) + 1
        );

    }


    const colours =
        Array.from(
            frequency.keys()
        );


    if (
        colours.length > 4
    ) {

        throw new Error(
            "This image contains " +
            colours.length +
            " colours. " +
            "A lossless Game Boy Camera image " +
            "must contain four colours or fewer."
        );

    }


    /*
     * Most frequently used colours first.
     */
    colours.sort(
        (a, b) =>
            frequency.get(b) -
            frequency.get(a)
    );


    /*
     * Build colour → 0..3 lookup.
     */
    const colourMap =
        new Map();


    for (
        let i = 0;
        i < colours.length;
        i++
    ) {

        colourMap.set(
            colours[i],
            i
        );

    }


    /*
     * Pad palette to four colours.
     */
    while (
        colours.length < 4
    ) {

        colours.push(
            colours.length
                ? colours[
                    colours.length - 1
                ]
                : 0
        );

    }


    /*
     * Convert RGB pixels into
     * 2-bit shade indexes.
     */
    const pixelIndexes =
        new Uint8Array(
            width * height
        );


    let pixelIndex =
        0;


    for (
        let i = 0;
        i < rgba.length;
        i += 4
    ) {

        const colour =
            (
                rgba[i] << 16
            ) |
            (
                rgba[i + 1] << 8
            ) |
            rgba[i + 2];


        pixelIndexes[
            pixelIndex++
        ] =
            colourMap.get(
                colour
            );

    }


    /*
     * ----------------------------------------------------
     * CANDIDATE 1
     *
     * Adaptive RLE / packed rows
     * ----------------------------------------------------
     */
    const adaptive =
        createAdaptiveRows(
            pixelIndexes,
            width,
            height
        );


    const headerAdaptive =
        createHeader(
            width,
            height,
            colours,
            0
        );


    const candidateAdaptive =
        combine(
            headerAdaptive,
            adaptive
        );


    /*
     * ----------------------------------------------------
     * CANDIDATE 2
     *
     * DEFLATE(adaptive)
     * ----------------------------------------------------
     */
    const compressedAdaptive =
        await deflate(
            adaptive
        );


    const headerCompressedAdaptive =
        createHeader(
            width,
            height,
            colours,
            1
        );


    const candidateCompressedAdaptive =
        combine(
            headerCompressedAdaptive,
            compressedAdaptive
        );


    /*
     * ----------------------------------------------------
     * CANDIDATE 3
     *
     * Entire image packed 2-bit
     * ----------------------------------------------------
     */
    const packed =
        packPixels(
            pixelIndexes,
            width,
            height
        );


    const headerPacked =
        createHeader(
            width,
            height,
            colours,
            2
        );


    const candidatePacked =
        combine(
            headerPacked,
            packed
        );


    /*
     * ----------------------------------------------------
     * CANDIDATE 4
     *
     * DEFLATE(packed)
     * ----------------------------------------------------
     */
    const compressedPacked =
        await deflate(
            packed
        );


    const headerCompressedPacked =
        createHeader(
            width,
            height,
            colours,
            3
        );


    const candidateCompressedPacked =
        combine(
            headerCompressedPacked,
            compressedPacked
        );


    /*
     * ----------------------------------------------------
     * PICK SMALLEST
     * ----------------------------------------------------
     */

    const candidates = [
        {
            data:
                candidateAdaptive,
            name:
                "Adaptive"
        },
        {
            data:
                candidateCompressedAdaptive,
            name:
                "DEFLATE adaptive"
        },
        {
            data:
                candidatePacked,
            name:
                "Packed"
        },
        {
            data:
                candidateCompressedPacked,
            name:
                "DEFLATE packed"
        }
    ];


    candidates.sort(
        (a, b) =>
            a.data.length -
            b.data.length
    );


    const best =
        candidates[0];


    console.log(
        "GBC2 compression:",
        candidates.map(
            candidate =>
                candidate.name +
                ": " +
                candidate.data.length +
                " bytes"
        )
    );


    console.log(
        "Selected:",
        best.name,
        best.data.length,
        "bytes"
    );


    return (
        GBC_MAGIC +
        "/" +
        bytesToBase64Url(
            best.data
        )
    );

}


/*
============================================================
DECODE ADAPTIVE ROWS
============================================================
*/

function decodeAdaptiveRows(
    data,
    width,
    height
) {

    const modeBytes =
        Math.ceil(
            height / 8
        );


    if (
        data.length <
        modeBytes
    ) {

        throw new Error(
            "Invalid GBC2 adaptive data."
        );

    }


    const modes =
        data.subarray(
            0,
            modeBytes
        );


    let offset =
        modeBytes;


    const pixels =
        new Uint8Array(
            width * height
        );


    let pixelIndex =
        0;


    for (
        let y = 0;
        y < height;
        y++
    ) {

        const packedMode =
            (
                modes[
                    Math.floor(y / 8)
                ] >>
                (y % 8)
            ) & 1;


        /*
         * ------------------------------------------------
         * PACKED ROW
         * ------------------------------------------------
         */
        if (
            packedMode === 1
        ) {

            const rowBytes =
                Math.ceil(
                    width / 4
                );


            if (
                offset + rowBytes >
                data.length
            ) {

                throw new Error(
                    "Invalid packed GBC2 row."
                );

            }


            for (
                let i = 0;
                i < width;
                i++
            ) {

                const byte =
                    data[
                        offset +
                        Math.floor(i / 4)
                    ];


                const shift =
                    6 -
                    (
                        (i % 4) *
                        2
                    );


                pixels[
                    pixelIndex++
                ] =
                    (
                        byte >>
                        shift
                    ) & 3;

            }


            offset +=
                rowBytes;

        }


        /*
         * ------------------------------------------------
         * RLE ROW
         * ------------------------------------------------
         */
        else {

            let rowPixels =
                0;


            while (
                rowPixels <
                width
            ) {

                if (
                    offset >=
                    data.length
                ) {

                    throw new Error(
                        "Invalid GBC2 RLE row."
                    );

                }


                const value =
                    data[
                        offset++
                    ];


                const shade =
                    value >> 6;


                const count =
                    (
                        value &
                        63
                    ) + 1;


                if (
                    rowPixels +
                    count >
                    width
                ) {

                    throw new Error(
                        "GBC2 RLE row exceeds width."
                    );

                }


                for (
                    let n = 0;
                    n < count;
                    n++
                ) {

                    pixels[
                        pixelIndex++
                    ] =
                        shade;

                }


                rowPixels +=
                    count;

            }

        }

    }


    if (
        offset !== data.length
    ) {

        throw new Error(
            "GBC2 adaptive data contains trailing bytes."
        );

    }


    return pixels;

}


/*
============================================================
UNPACK ENTIRE IMAGE
============================================================
*/

function unpackPixels(
    data,
    width,
    height
) {

    const expected =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        data.length !== expected
    ) {

        throw new Error(
            "Invalid GBC2 packed pixel data."
        );

    }


    const pixels =
        new Uint8Array(
            width *
            height
        );


    let pixelIndex =
        0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const value =
            data[i];


        for (
            let shift = 6;
            shift >= 0 &&
            pixelIndex <
                pixels.length;
            shift -= 2
        ) {

            pixels[
                pixelIndex++
            ] =
                (
                    value >>
                    shift
                ) & 3;

        }

    }


    return pixels;

}


/*
============================================================
CREATE IMAGE FROM PIXELS
============================================================
*/

function pixelsToCanvas(
    pixels,
    width,
    height,
    palette
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const shade =
            pixels[i];


        const paletteOffset =
            shade * 3;


        const outputOffset =
            i * 4;


        imageData.data[
            outputOffset
        ] =
            palette[
                paletteOffset
            ];


        imageData.data[
            outputOffset + 1
        ] =
            palette[
                paletteOffset + 1
            ];


        imageData.data[
            outputOffset + 2
        ] =
            palette[
                paletteOffset + 2
            ];


        imageData.data[
            outputOffset + 3
        ] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/*
============================================================
DECODE GBC2
============================================================
*/

async function decodeGBC2(
    encoded
) {

    if (
        !encoded.startsWith(
            GBC_MAGIC + "/"
        )
    ) {

        throw new Error(
            "Invalid GBC2 image."
        );

    }


    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC_MAGIC.length + 1
            )
        );


    const firstByte =
        compressed[0];


    /*
     * We need at least the 14-byte header.
     */
    if (
        compressed.length <
        14
    ) {

        throw new Error(
            "GBC2 image is too short."
        );

    }


    /*
     * First byte is version.
     *
     * For compressed codecs the header is
     * inside the compressed payload, so first
     * inspect the codec from the raw candidate
     * by trying both possibilities below.
     *
     * The first byte is always the GBC2 version
     * only when data is uncompressed.
     */
    let raw;


    /*
     * The first byte is not enough to identify
     * whether the payload itself is compressed.
     *
     * Try interpreting it as a header first.
     */
    if (
        firstByte === GBC_VERSION
    ) {

        raw =
            compressed;

    }
    else {

        /*
         * Compressed candidates have the header
         * compressed together with the data in
         * the old design.
         *
         * Try inflate.
         */
        raw =
            await inflate(
                compressed
            );

    }


    /*
     * Validate header.
     */
    if (
        raw.length <
        14 ||
        raw[0] !== GBC_VERSION
    ) {

        throw new Error(
            "Invalid GBC2 header."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width =
            128;

        height =
            112;

    }
    else if (
        dimensionCode === 1
    ) {

        width =
            160;

        height =
            144;

    }
    else {

        throw new Error(
            "Unsupported GBC2 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    /*
     * Palette.
     */
    const palette =
        new Uint8Array(
            raw.subarray(
                2,
                14
            )
        );


    let data =
        raw.subarray(
            14
        );


    /*
     * For codecs 1 and 3, the entire data
     * after the header is DEFLATE compressed.
     */
    if (
        codec === 1 ||
        codec === 3
    ) {

        data =
            await inflate(
                data
            );

    }


    let pixels;


    /*
     * Adaptive.
     */
    if (
        codec === 0 ||
        codec === 1
    ) {

        pixels =
            decodeAdaptiveRows(
                data,
                width,
                height
            );

    }


    /*
     * Packed.
     */
    else if (
        codec === 2 ||
        codec === 3
    ) {

        pixels =
            unpackPixels(
                data,
                width,
                height
            );

    }


    else {

        throw new Error(
            "Unsupported GBC2 codec."
        );

    }


    return pixelsToCanvas(
        pixels,
        width,
        height,
        palette
    );

}


/*
============================================================
LOAD GBC2
============================================================
*/

async function loadGBC2(
    encoded
) {

    const canvas =
        await decodeGBC2(
            encoded
        );


    /*
     * PNG exists only temporarily in memory
     * for the browser <img> element.
     *
     * It is NOT stored in the URL.
     */
    const imageUrl =
        canvas.toDataURL(
            "image/png"
        );


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "Could not display GBC2 image."
            );

        };


    photo.src =
        imageUrl;

}


/*
============================================================
GBC1 DECODER
============================================================
*/

/*
 * GBC1 used:
 *
 * packed
 * XOR
 * RLE
 *
 * followed by DEFLATE.
 *
 * Keep this decoder so old GBC1 URLs continue
 * working.
 */


function xorDecode(
    bytes
) {

    const output =
        new Uint8Array(
            bytes.length
        );


    let previous =
        0;


    for (
        let i = 0;
        i < bytes.length;
        i++
    ) {

        output[i] =
            bytes[i] ^
            previous;


        previous =
            output[i];

    }


    return output;

}


function rleDecodeGBC1(
    bytes
) {

    const output = [];

    let i =
        0;


    while (
        i < bytes.length
    ) {

        const value =
            bytes[i++];


        if (
            value !== 255
        ) {

            output.push(
                value
            );


            continue;

        }


        if (
            i + 1 >=
            bytes.length
        ) {

            throw new Error(
                "Invalid GBC1 RLE data."
            );

        }


        const marker =
            bytes[i++];


        const count =
            bytes[i++];


        if (
            marker !== 0 ||
            count === 0
        ) {

            throw new Error(
                "Invalid GBC1 RLE sequence."
            );

        }


        if (
            count === 1
        ) {

            output.push(
                255
            );

        }
        else {

            for (
                let n = 0;
                n < count;
                n++
            ) {

                output.push(
                    0
                );

            }

        }

    }


    return new Uint8Array(
        output
    );

}


async function decodeGBC1(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                5
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length <
        14
    ) {

        throw new Error(
            "GBC1 image is too short."
        );

    }


    if (
        raw[0] !== 1
    ) {

        throw new Error(
            "Unsupported GBC1 version."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width =
            128;

        height =
            112;

    }
    else if (
        dimensionCode === 1
    ) {

        width =
            160;

        height =
            144;

    }
    else {

        throw new Error(
            "Unsupported GBC1 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    const palette =
        new Uint8Array(
            raw.subarray(
                2,
                14
            )
        );


    let pixelData =
        raw.subarray(
            14
        );


    if (
        codec === 1
    ) {

        pixelData =
            xorDecode(
                pixelData
            );

    }
    else if (
        codec === 2
    ) {

        pixelData =
            xorDecode(
                rleDecodeGBC1(
                    pixelData
                )
            );

    }
    else if (
        codec !== 0
    ) {

        throw new Error(
            "Unsupported GBC1 codec."
        );

    }


    const expectedLength =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        pixelData.length !==
        expectedLength
    ) {

        throw new Error(
            "Invalid GBC1 pixel data."
        );

    }


    const pixels =
        unpackPixels(
            pixelData,
            width,
            height
        );


    return pixelsToCanvas(
        pixels,
        width,
        height,
        palette
    );

}


/*
============================================================
LOAD GBC1
============================================================
*/

async function loadGBC1(
    encoded
) {

    const canvas =
        await decodeGBC1(
            encoded
        );


    const imageUrl =
        canvas.toDataURL(
            "image/png"
        );


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "Could not display GBC1 image."
            );

        };


    photo.src =
        imageUrl;

}


/*
============================================================
LEGACY PNG URL SUPPORT
============================================================
*/

function loadLegacyPNG(
    encoded
) {

    let base64 =
        encoded
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "The image data in this URL could not be decoded."
            );

        };


    photo.src =
        "data:image/png;base64," +
        base64;

}


/*
============================================================
LOAD IMAGE FROM HASH
============================================================
*/

async function loadImageFromHash() {

    const encoded =
        window.location.hash.substring(
            1
        );


    /*
     * No image.
     */
    if (!encoded) {

        upload.style.display =
            "flex";


        photo.style.display =
            "none";


        return;

    }


    errorBox.style.display =
        "none";


    try {

        /*
         * GBC2
         */
        if (
            encoded.startsWith(
                "GBC2/"
            )
        ) {

            await loadGBC2(
                encoded
            );


            return;

        }


        /*
         * GBC1
         */
        if (
            encoded.startsWith(
                "GBC1/"
            )
        ) {

            await loadGBC1(
                encoded
            );


            return;

        }


        /*
         * Anything else is assumed to be
         * the old PNG/Base64 format.
         */
        loadLegacyPNG(
            encoded
        );

    }
    catch (error) {

        console.error(
            error
        );


        upload.style.display =
            "none";


        photo.style.display =
            "none";


        showError(
            error.message ||
            "Invalid image URL."
        );

    }

}


/*
============================================================
UPLOAD IMAGE
============================================================
*/

fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files[0];


        if (!file) {

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function () {

                const image =
                    new Image();


                image.onload =
                    async function () {

                        try {

                            /*
                             * Preserve original dimensions.
                             */
                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                image.naturalWidth;


                            canvas.height =
                                image.naturalHeight;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            /*
                             * Absolutely no interpolation.
                             */
                            ctx.imageSmoothingEnabled =
                                false;


                            ctx.drawImage(
                                image,
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );


                            const imageData =
                                ctx.getImageData(
                                    0,
                                    0,
                                    canvas.width,
                                    canvas.height
                                );


                            /*
                             * Encode using GBC2.
                             */
                            const encoded =
                                await encodeGBC2(
                                    imageData,
                                    canvas.width,
                                    canvas.height
                                );


                            /*
                             * Put GBC2 URL in the address bar.
                             *
                             * Setting .hash automatically creates
                             * the hashchange event.
                             */
                            window.location.hash =
                                encoded;


                            /*
                             * Immediately display it.
                             *
                             * No refresh required.
                             */
                            await loadImageFromHash();

                        }
                        catch (error) {

                            console.error(
                                error
                            );


                            showError(
                                error.message ||
                                "Could not encode Game Boy Camera image."
                            );

                        }

                    };


                image.onerror =
                    function () {

                        showError(
                            "Could not read the selected image."
                        );

                    };


                image.src =
                    reader.result;

            };


        reader.onerror =
            function () {

                showError(
                    "Could not read the selected file."
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);


/*
============================================================
BROWSER BACK / FORWARD
============================================================
*/

window.addEventListener(
    "hashchange",
    function () {

        loadImageFromHash();

    }
);


/*
============================================================
CLICK IMAGE → COPY URL
============================================================
*/

photo.addEventListener(
    "click",
    async function () {

        const url =
            window.location.href;


        try {

            await navigator.clipboard.writeText(
                url
            );


            copiedBox.style.display =
                "block";


            setTimeout(
                function () {

                    copiedBox.style.display =
                        "none";

                },
                1500
            );

        }
        catch (error) {

            /*
             * Clipboard fallback.
             */
            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";


            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    "copy"
                );


                copiedBox.style.display =
                    "block";


                setTimeout(
                    function () {

                        copiedBox.style.display =
                            "none";

                    },
                    1500
                );

            }
            catch (e) {

                showError(
                    "Could not copy URL."
                );

            }


            document.body.removeChild(
                textarea
            );

        }

    }
);


/*
============================================================
START
============================================================
*/

loadImageFromHash();

</script>
