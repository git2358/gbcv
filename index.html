<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Game Boy Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}


body {

    display: flex;

    align-items: center;
    justify-content: center;

}


/*
============================================================
IMAGE VIEWER
============================================================
*/

#photo {

    display: none;

    width: 98vw;
    height: 98vh;

    object-fit: contain;

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    image-rendering: pixelated;
    image-rendering: crisp-edges;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;

}


/*
============================================================
UPLOAD SCREEN
============================================================
*/

#upload {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 15px;

    color: #fff;

    text-align: center;

    font-family: sans-serif;

}


#upload label {

    display: inline-block;

    padding: 14px 22px;

    background: #222;

    border: 1px solid #555;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

}


#upload label:hover {

    background: #333;

}


#file {

    display: none;

}


/*
============================================================
STATUS
============================================================
*/

#status {

    color: #aaa;

    font-family: monospace;

    font-size: 12px;

    max-width: 90vw;

    text-align: center;

}


/*
============================================================
ERROR
============================================================
*/

#error {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    max-width: 90vw;

    padding: 10px 15px;

    background:
        rgba(150, 0, 0, 0.9);

    color: white;

    font-family: monospace;

    font-size: 13px;

    border-radius: 6px;

    text-align: center;

    z-index: 10;

}


/*
============================================================
COPIED
============================================================
*/

#copied {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    padding: 10px 15px;

    background:
        rgba(0, 0, 0, 0.85);

    color: white;

    font-family: sans-serif;

    font-size: 14px;

    border-radius: 6px;

    z-index: 10;

}

</style>

</head>


<body>


<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <input
        id="file"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

    <div id="status"></div>

</div>


<img
    id="photo"
    alt="Game Boy Camera Photo"
>


<div id="error"></div>


<div id="copied">
    URL copied!
</div>


<script>

/*
################################################################
#
# GBC4
#
# GAME BOY CAMERA ADAPTIVE DISCORD FORMAT
#
################################################################
#
# Main goal:
#
#   MAXIMUM VISUAL QUALITY
#   subject to a maximum URL length.
#
#
# GBC4 stores:
#
#   WebP image
#       ↓
#   Base64URL
#       ↓
#   #GBC4/
#
#
# The encoder automatically tests many combinations of:
#
#   • resolution
#   • WebP quality
#
# and chooses the best candidate that fits the URL limit.
#
#
# Older formats remain readable:
#
#   GBC1
#   GBC2
#   GBC3
#   legacy PNG/Base64
#
################################################################
*/


/*
============================================================
GBC4 SETTINGS
============================================================
*/


/*
 * Discord's commonly encountered URL limit is around
 * 2000 characters.
 *
 * We deliberately target 1900 characters to leave room
 * for safety.
 *
 * Change this to 1950 or 2000 if desired.
 */
const MAX_COMPLETE_URL_LENGTH =
    1900;


/*
 * Minimum dimensions we are willing to use.
 *
 * We deliberately do NOT immediately destroy the image
 * when the full-size version does not fit.
 */
const MIN_WIDTH =
    80;

const MIN_HEIGHT =
    70;


/*
 * GBC4 magic.
 */
const GBC4_MAGIC =
    "GBC4";


const GBC1_MAGIC =
    "GBC1";


const GBC2_MAGIC =
    "GBC2";


const GBC3_MAGIC =
    "GBC3";


/*
============================================================
DOM
============================================================
*/

const photo =
    document.getElementById(
        "photo"
    );


const upload =
    document.getElementById(
        "upload"
    );


const fileInput =
    document.getElementById(
        "file"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const copiedBox =
    document.getElementById(
        "copied"
    );


const statusBox =
    document.getElementById(
        "status"
    );


/*
============================================================
ERROR
============================================================
*/

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/*
============================================================
STATUS
============================================================
*/

function setStatus(message) {

    statusBox.textContent =
        message;

}


/*
============================================================
BASE64URL ENCODE
============================================================
*/

function bytesToBase64Url(bytes) {

    let binary = "";

    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );


        binary +=
            String.fromCharCode(
                ...chunk
            );

    }


    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


/*
============================================================
BASE64URL DECODE
============================================================
*/

function base64UrlToBytes(string) {

    let base64 =
        string
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/*
============================================================
DEFLATE
============================================================
*/

/*
 * Kept for GBC1/GBC2/GBC3 compatibility.
 */

async function inflate(bytes) {

    if (
        !("DecompressionStream" in window)
    ) {

        throw new Error(
            "This browser does not support decompression."
        );

    }


    const stream =
        new Blob([bytes])
            .stream()
            .pipeThrough(
                new DecompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
GBC4 WEBP ENCODER
============================================================
*/

function canvasToWebP(
    canvas,
    quality
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            canvas.toBlob(
                function (blob) {

                    if (!blob) {

                        reject(
                            new Error(
                                "This browser could not create WebP."
                            )
                        );

                        return;

                    }


                    resolve(blob);

                },
                "image/webp",
                quality
            );

        }
    );

}


/*
============================================================
BLOB → UINT8ARRAY
============================================================
*/

async function blobToBytes(
    blob
) {

    return new Uint8Array(
        await blob.arrayBuffer()
    );

}


/*
============================================================
GBC4 CANDIDATE
============================================================
*/

async function createGBC4Candidate(
    sourceCanvas,
    width,
    height,
    quality
) {

    /*
     * Create candidate canvas.
     */
    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
     * For normal GBC-sized images, pixel-perfect
     * scaling is preferable.
     *
     * When reducing resolution, a small amount of
     * smoothing is useful because it prevents the
     * dither pattern from turning into huge blocks.
     */
    ctx.imageSmoothingEnabled =
        width < sourceCanvas.width;


    ctx.drawImage(
        sourceCanvas,
        0,
        0,
        width,
        height
    );


    /*
     * Encode as WebP.
     */
    const blob =
        await canvasToWebP(
            canvas,
            quality
        );


    const bytes =
        await blobToBytes(
            blob
        );


    const base64 =
        bytesToBase64Url(
            bytes
        );


    const encoded =
        GBC4_MAGIC +
        "/" +
        base64;


    return {
        encoded,
        width,
        height,
        quality,
        bytes: bytes.length,
        canvas
    };

}


/*
============================================================
GENERATE DIMENSION CANDIDATES
============================================================
*/

function generateDimensions(
    sourceWidth,
    sourceHeight
) {

    const candidates = [];


    /*
     * Always try the original resolution first.
     */
    const scales = [
        1.00,
        0.95,
        0.90,
        0.85,
        0.80,
        0.75,
        0.70,
        0.65,
        0.60,
        0.55,
        0.50,
        0.45,
        0.40,
        0.35,
        0.30,
        0.25
    ];


    for (
        const scale of scales
    ) {

        let width =
            Math.round(
                sourceWidth * scale
            );


        let height =
            Math.round(
                sourceHeight * scale
            );


        /*
         * Keep dimensions even.
         */
        width -=
            width % 2;


        height -=
            height % 2;


        if (
            width < MIN_WIDTH ||
            height < MIN_HEIGHT
        ) {

            continue;

        }


        const exists =
            candidates.some(
                function (candidate) {

                    return (
                        candidate.width === width &&
                        candidate.height === height
                    );

                }
            );


        if (!exists) {

            candidates.push({
                width,
                height,
                scale
            });

        }

    }


    return candidates;

}


/*
============================================================
QUALITY CANDIDATES
============================================================
*/

function generateQualityCandidates() {

    /*
     * High quality is deliberately tried first.
     *
     * The encoder therefore keeps quality as high
     * as possible before sacrificing resolution.
     */
    return [
        0.95,
        0.90,
        0.88,
        0.86,
        0.84,
        0.82,
        0.80,
        0.78,
        0.76,
        0.74,
        0.72,
        0.70,
        0.68,
        0.65,
        0.62,
        0.60,
        0.57,
        0.54,
        0.50
    ];

}


/*
============================================================
SELECT BEST GBC4 IMAGE
============================================================
*/

async function encodeGBC4(
    sourceCanvas
) {

    const sourceWidth =
        sourceCanvas.width;


    const sourceHeight =
        sourceCanvas.height;


    /*
     * The hash occupies part of the complete URL.
     *
     * Estimate the current page URL without the hash.
     */
    const baseUrl =
        window.location.href
            .split("#")[0];


    const maxHashLength =
        Math.max(
            100,
            MAX_COMPLETE_URL_LENGTH -
            baseUrl.length -
            1
        );


    const dimensions =
        generateDimensions(
            sourceWidth,
            sourceHeight
        );


    const qualities =
        generateQualityCandidates();


    let best =
        null;


    let tested =
        0;


    /*
     * IMPORTANT:
     *
     * We iterate resolution from largest to smallest.
     *
     * Within each resolution we iterate quality from
     * highest to lowest.
     *
     * Therefore the first fitting candidate at a
     * resolution is the highest quality available
     * at that resolution.
     */
    for (
        const dimension of dimensions
    ) {

        for (
            const quality of qualities
        ) {

            tested++;


            setStatus(
                "Optimising image… " +
                dimension.width +
                "×" +
                dimension.height +
                " @ " +
                Math.round(
                    quality * 100
                ) +
                "%"
            );


            const candidate =
                await createGBC4Candidate(
                    sourceCanvas,
                    dimension.width,
                    dimension.height,
                    quality
                );


            /*
             * Hash length.
             */
            const hashLength =
                candidate.encoded.length;


            /*
             * Fits.
             */
            if (
                hashLength <=
                maxHashLength
            ) {

                best =
                    candidate;


                /*
                 * We can stop searching this resolution.
                 *
                 * This is the highest quality candidate
                 * at this resolution that fits.
                 */
                break;

            }

        }


        /*
         * If we found a fitting candidate at the
         * largest possible resolution, stop.
         */
        if (
            best !== null
        ) {

            break;

        }

    }


    /*
     * Nothing fit.
     *
     * This should be extremely unlikely, but provide
     * a clear error instead of producing a terrible
     * image.
     */
    if (
        best === null
    ) {

        throw new Error(
            "Could not fit this image inside the " +
            MAX_COMPLETE_URL_LENGTH +
            "-character URL limit."
        );

    }


    /*
     * Diagnostics.
     */
    best.tested =
        tested;


    best.maxHashLength =
        maxHashLength;


    best.completeUrlLength =
        baseUrl.length +
        1 +
        best.encoded.length;


    return best;

}


/*
============================================================
DISPLAY CANVAS
============================================================
*/

function displayCanvas(
    canvas
) {

    const imageUrl =
        canvas.toDataURL(
            "image/png"
        );


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "Could not display image."
            );

        };


    photo.src =
        imageUrl;

}


/*
============================================================
LOAD GBC4
============================================================
*/

async function loadGBC4(
    encoded
) {

    if (
        !encoded.startsWith(
            GBC4_MAGIC + "/"
        )
    ) {

        throw new Error(
            "Invalid GBC4 image."
        );

    }


    const base64 =
        encoded.substring(
            GBC4_MAGIC.length + 1
        );


    const bytes =
        base64UrlToBytes(
            base64
        );


    /*
     * WebP can be decoded directly by the browser.
     */
    const blob =
        new Blob(
            [bytes],
            {
                type: "image/webp"
            }
        );


    const imageUrl =
        URL.createObjectURL(
            blob
        );


    const image =
        new Image();


    await new Promise(
        function (
            resolve,
            reject
        ) {

            image.onload =
                resolve;


            image.onerror =
                function () {

                    reject(
                        new Error(
                            "GBC4 WebP image could not be decoded."
                        )
                    );

                };


            image.src =
                imageUrl;

        }
    );


    /*
     * Copy WebP into a canvas.
     */
    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        image.naturalWidth;


    canvas.height =
        image.naturalHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        false;


    ctx.drawImage(
        image,
        0,
        0
    );


    URL.revokeObjectURL(
        imageUrl
    );


    displayCanvas(
        canvas
    );

}


/*
============================================================
GBC3 DECODER
============================================================
*/

function unpackRow(
    packed,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    for (
        let x = 0;
        x < width;
        x++
    ) {

        const byteIndex =
            Math.floor(
                x / 4
            );


        const shift =
            6 -
            (
                (x % 4) * 2
            );


        row[x] =
            (
                packed[byteIndex] >>
                shift
            ) & 3;

    }


    return row;

}


function decodeRowRLE(
    bytes,
    offset,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    let x =
        0;


    while (
        x < width
    ) {

        if (
            offset >= bytes.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 RLE row."
            );

        }


        const token =
            bytes[offset++];


        const shade =
            token >> 6;


        const count =
            (
                token & 63
            ) + 1;


        if (
            x + count > width
        ) {

            throw new Error(
                "GBC3 RLE row exceeds width."
            );

        }


        row.fill(
            shade,
            x,
            x + count
        );


        x += count;

    }


    return {
        row,
        offset
    };

}


async function decodeGBC3(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC3_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14 ||
        raw[0] !== 3
    ) {

        throw new Error(
            "Invalid GBC3 image."
        );

    }


    const dimensionCode =
        raw[1];


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width = 128;
        height = 112;

    }
    else if (
        dimensionCode === 1
    ) {

        width = 160;
        height = 144;

    }
    else {

        throw new Error(
            "Unsupported GBC3 dimensions."
        );

    }


    const palette =
        raw.subarray(
            2,
            14
        );


    const pixels =
        new Uint8Array(
            width * height
        );


    let offset =
        14;


    let previousRow =
        null;


    for (
        let y = 0;
        y < height;
        y++
    ) {

        if (
            offset >= raw.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 image."
            );

        }


        const mode =
            raw[offset++];


        if (
            mode === 0
        ) {

            const result =
                decodeRowRLE(
                    raw,
                    offset,
                    width
                );


            offset =
                result.offset;


            pixels.set(
                result.row,
                y * width
            );


            previousRow =
                result.row;

        }
        else if (
            mode === 1
        ) {

            const packedLength =
                Math.ceil(
                    width / 4
                );


            if (
                offset +
                packedLength >
                raw.length
            ) {

                throw new Error(
                    "Unexpected end of GBC3 packed row."
                );

            }


            const row =
                unpackRow(
                    raw.subarray(
                        offset,
                        offset + packedLength
                    ),
                    width
                );


            offset +=
                packedLength;


            pixels.set(
                row,
                y * width
            );


            previousRow =
                row;

        }
        else if (
            mode === 2
        ) {

            if (
                previousRow === null
            ) {

                throw new Error(
                    "GBC3 repeat without previous row."
                );

            }


            pixels.set(
                previousRow,
                y * width
            );

        }
        else {

            throw new Error(
                "Unknown GBC3 row mode."
            );

        }

    }


    return createPaletteCanvas(
        width,
        height,
        pixels,
        palette
    );

}


/*
============================================================
CREATE PALETTE CANVAS
============================================================
*/

function createPaletteCanvas(
    width,
    height,
    pixels,
    palette
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const shade =
            pixels[i];


        const p =
            shade * 3;


        const o =
            i * 4;


        imageData.data[o] =
            palette[p];


        imageData.data[o + 1] =
            palette[p + 1];


        imageData.data[o + 2] =
            palette[p + 2];


        imageData.data[o + 3] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/*
============================================================
GBC1 DECODER
============================================================
*/

function xorDecode(
    bytes
) {

    const output =
        new Uint8Array(
            bytes.length
        );


    let previous =
        0;


    for (
        let i = 0;
        i < bytes.length;
        i++
    ) {

        output[i] =
            bytes[i] ^
            previous;


        previous =
            output[i];

    }


    return output;

}


function rleDecodeGBC1(
    bytes
) {

    const output =
        [];


    let i =
        0;


    while (
        i < bytes.length
    ) {

        const value =
            bytes[i++];


        if (
            value !== 255
        ) {

            output.push(
                value
            );


            continue;

        }


        if (
            i + 1 >= bytes.length
        ) {

            throw new Error(
                "Invalid GBC1 RLE."
            );

        }


        const marker =
            bytes[i++];


        const count =
            bytes[i++];


        if (
            marker !== 0 ||
            count === 0
        ) {

            throw new Error(
                "Invalid GBC1 RLE."
            );

        }


        if (
            count === 1
        ) {

            output.push(
                255
            );

        }
        else {

            for (
                let n = 0;
                n < count;
                n++
            ) {

                output.push(
                    0
                );

            }

        }

    }


    return new Uint8Array(
        output
    );

}


async function decodeGBC1(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC1_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14 ||
        raw[0] !== 1
    ) {

        throw new Error(
            "Invalid GBC1 image."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width = 128;
        height = 112;

    }
    else if (
        dimensionCode === 1
    ) {

        width = 160;
        height = 144;

    }
    else {

        throw new Error(
            "Unsupported GBC1 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    const palette =
        raw.subarray(
            2,
            14
        );


    let pixelData =
        raw.subarray(
            14
        );


    if (
        codec === 1
    ) {

        pixelData =
            xorDecode(
                pixelData
            );

    }
    else if (
        codec === 2
    ) {

        pixelData =
            xorDecode(
                rleDecodeGBC1(
                    pixelData
                )
            );

    }
    else if (
        codec !== 0
    ) {

        throw new Error(
            "Unsupported GBC1 codec."
        );

    }


    const expected =
        Math.ceil(
            width * height / 4
        );


    if (
        pixelData.length !== expected
    ) {

        throw new Error(
            "Invalid GBC1 pixel data."
        );

    }


    const pixels =
        new Uint8Array(
            width * height
        );


    let pixel =
        0;


    for (
        const packed of pixelData
    ) {

        for (
            let shift = 6;
            shift >= 0 &&
            pixel < pixels.length;
            shift -= 2
        ) {

            pixels[pixel++] =
                (
                    packed >>
                    shift
                ) & 3;

        }

    }


    return createPaletteCanvas(
        width,
        height,
        pixels,
        palette
    );

}


/*
============================================================
LEGACY PNG
============================================================
*/

function loadLegacyPNG(
    encoded
) {

    let base64 =
        encoded
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    return new Promise(
        function (
            resolve,
            reject
        ) {

            photo.onload =
                function () {

                    upload.style.display =
                        "none";


                    photo.style.display =
                        "block";


                    resolve();

                };


            photo.onerror =
                function () {

                    reject(
                        new Error(
                            "The legacy PNG data could not be decoded."
                        )
                    );

                };


            photo.src =
                "data:image/png;base64," +
                base64;

        }
    );

}


/*
============================================================
LOAD IMAGE FROM HASH
============================================================
*/

async function loadImageFromHash() {

    const encoded =
        window.location.hash.substring(
            1
        );


    if (!encoded) {

        upload.style.display =
            "flex";


        photo.style.display =
            "none";


        setStatus(
            "Maximum URL: " +
            MAX_COMPLETE_URL_LENGTH +
            " characters"
        );


        return;

    }


    errorBox.style.display =
        "none";


    try {

        /*
         * GBC4
         */
        if (
            encoded.startsWith(
                GBC4_MAGIC + "/"
            )
        ) {

            await loadGBC4(
                encoded
            );


            return;

        }


        /*
         * GBC3
         */
        if (
            encoded.startsWith(
                GBC3_MAGIC + "/"
            )
        ) {

            const canvas =
                await decodeGBC3(
                    encoded
                );


            displayCanvas(
                canvas
            );


            return;

        }


        /*
         * GBC2
         *
         * The original GBC2 format used the same
         * compressed container/header family as GBC1
         * but may contain its own encoder-specific
         * flags.
         *
         * Attempt the GBC1-compatible decoder first.
         */
        if (
            encoded.startsWith(
                GBC2_MAGIC + "/"
            )
        ) {

            /*
             * GBC2 compatibility.
             *
             * Strip the GBC2 identifier and decode its
             * payload using the legacy packed decoder.
             */
            const gbc1Compatible =
                GBC1_MAGIC +
                encoded.substring(
                    GBC2_MAGIC.length
                );


            const canvas =
                await decodeGBC1(
                    gbc1Compatible
                );


            displayCanvas(
                canvas
            );


            return;

        }


        /*
         * GBC1
         */
        if (
            encoded.startsWith(
                GBC1_MAGIC + "/"
            )
        ) {

            const canvas =
                await decodeGBC1(
                    encoded
                );


            displayCanvas(
                canvas
            );


            return;

        }


        /*
         * Old raw PNG/Base64 URL.
         */
        await loadLegacyPNG(
            encoded
        );

    }
    catch (error) {

        console.error(
            error
        );


        upload.style.display =
            "none";


        photo.style.display =
            "none";


        showError(
            error.message ||
            "Invalid image URL."
        );

    }

}


/*
============================================================
UPLOAD IMAGE
============================================================
*/

fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files[0];


        if (!file) {

            return;

        }


        errorBox.style.display =
            "none";


        setStatus(
            "Reading image…"
        );


        const reader =
            new FileReader();


        reader.onload =
            function () {

                const image =
                    new Image();


                image.onload =
                    async function () {

                        try {

                            const sourceWidth =
                                image.naturalWidth;


                            const sourceHeight =
                                image.naturalHeight;


                            /*
                             * Accept native GBC sizes.
                             */
                            if (
                                !(
                                    (
                                        sourceWidth === 128 &&
                                        sourceHeight === 112
                                    ) ||
                                    (
                                        sourceWidth === 160 &&
                                        sourceHeight === 144
                                    )
                                )
                            ) {

                                throw new Error(
                                    "Game Boy Camera images must be " +
                                    "128×112 or 160×144 pixels."
                                );

                            }


                            /*
                             * Source canvas.
                             */
                            const sourceCanvas =
                                document.createElement(
                                    "canvas"
                                );


                            sourceCanvas.width =
                                sourceWidth;


                            sourceCanvas.height =
                                sourceHeight;


                            const ctx =
                                sourceCanvas.getContext(
                                    "2d"
                                );


                            ctx.imageSmoothingEnabled =
                                false;


                            ctx.drawImage(
                                image,
                                0,
                                0,
                                sourceWidth,
                                sourceHeight
                            );


                            /*
                             * Encode using adaptive GBC4.
                             */
                            const result =
                                await encodeGBC4(
                                    sourceCanvas
                                );


                            /*
                             * Put the final GBC4 URL
                             * into the hash.
                             */
                            window.location.hash =
                                result.encoded;


                            /*
                             * Display immediately.
                             */
                            await loadImageFromHash();


                            /*
                             * Diagnostics.
                             */
                            console.log(
                                "=============================="
                            );


                            console.log(
                                "GBC4"
                            );


                            console.log(
                                "Original:",
                                sourceWidth +
                                "×" +
                                sourceHeight
                            );


                            console.log(
                                "Encoded:",
                                result.width +
                                "×" +
                                result.height
                            );


                            console.log(
                                "WebP quality:",
                                Math.round(
                                    result.quality * 100
                                ) +
                                "%"
                            );


                            console.log(
                                "WebP:",
                                result.bytes,
                                "bytes"
                            );


                            console.log(
                                "GBC4 hash:",
                                result.encoded.length,
                                "characters"
                            );


                            console.log(
                                "Complete URL:",
                                result.completeUrlLength,
                                "characters"
                            );


                            console.log(
                                "Maximum:",
                                MAX_COMPLETE_URL_LENGTH,
                                "characters"
                            );


                            console.log(
                                "Candidates tested:",
                                result.tested
                            );


                            console.log(
                                "=============================="
                            );


                            setStatus(
                                result.width +
                                "×" +
                                result.height +
                                " • WebP " +
                                Math.round(
                                    result.quality * 100
                                ) +
                                "% • URL " +
                                result.completeUrlLength +
                                "/" +
                                MAX_COMPLETE_URL_LENGTH
                            );

                        }
                        catch (error) {

                            console.error(
                                error
                            );


                            showError(
                                error.message ||
                                "Could not encode image."
                            );


                            setStatus("");

                        }

                    };


                image.onerror =
                    function () {

                        showError(
                            "Could not read the selected image."
                        );


                        setStatus("");

                    };


                image.src =
                    reader.result;

            };


        reader.onerror =
            function () {

                showError(
                    "Could not read the selected file."
                );


                setStatus("");

            };


        reader.readAsDataURL(
            file
        );

    }
);


/*
============================================================
BACK / FORWARD
============================================================
*/

window.addEventListener(
    "hashchange",
    function () {

        loadImageFromHash();

    }
);


/*
============================================================
CLICK IMAGE → COPY URL
============================================================
*/

photo.addEventListener(
    "click",
    async function () {

        const url =
            window.location.href;


        try {

            await navigator.clipboard.writeText(
                url
            );


            copiedBox.style.display =
                "block";


            setTimeout(
                function () {

                    copiedBox.style.display =
                        "none";

                },
                1500
            );

        }
        catch (error) {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";


            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    "copy"
                );


                copiedBox.style.display =
                    "block";


                setTimeout(
                    function () {

                        copiedBox.style.display =
                            "none";

                    },
                    1500
                );

            }
            catch (e) {

                showError(
                    "Could not copy URL."
                );

            }


            document.body.removeChild(
                textarea
            );

        }

    }
);


/*
============================================================
START
============================================================
*/

loadImageFromHash();

</script>
