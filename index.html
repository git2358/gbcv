<!DOCTYPE html>
<html lang="en">

>

<style>

* {

}

html,
body {

</head>

<body>

<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <input
        id="file"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

</div>

<img
    id="photo"
    alt="Game Boy Camera Photo"
>

<div id="error"></div>

<div id="copied">
    URL copied!
</div>

<script>

/*
################################################################
#
# GBC4
#
# GAME BOY CAMERA DISCORD COMPACT FORMAT
#
################################################################
#
# GBC4 is intentionally LOSSY.
#
# The goal is to produce a visually recognizable Game Boy
# Camera-style image using a URL short enough to share on
# services with URL length limits.
#
#
# PIPELINE
#
# Original image
#       ↓
# grayscale
#       ↓
# resize
#       ↓
# ordered 4-shade dithering
#       ↓
# 2-bit pixels
#       ↓
# compact bit packing
#       ↓
# optional delta transform
#       ↓
# DEFLATE
#       ↓
# Base64URL
#
#
# The encoder tries several resolutions and compression modes
# and automatically selects the shortest result.
#
################################################################
*/


const GBC1_MAGIC =
    "GBC1";


const GBC3_MAGIC =
    "GBC3";


const GBC4_MAGIC =
    "GBC4";


/*
============================================================
DOM
============================================================
*/

const photo =
    document.getElementById(
        "photo"
    );


const upload =
    document.getElementById(
        "upload"
    );


const fileInput =
    document.getElementById(
        "file"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const copiedBox =
    document.getElementById(
        "copied"
    );


/*
============================================================
ERROR
============================================================
*/

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/*
============================================================
BASE64URL
============================================================
*/

function bytesToBase64Url(bytes) {

    let binary = "";

    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );


        binary +=
            String.fromCharCode(
                ...chunk
            );

    }


    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


/*
============================================================
BASE64URL DECODE
============================================================
*/

function base64UrlToBytes(string) {

    let base64 =
        string
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/*
============================================================
DEFLATE
============================================================
*/

async function deflate(bytes) {

    if (
        !("CompressionStream" in window)
    ) {

        throw new Error(
            "This browser does not support DEFLATE compression."
        );

    }


    const stream =
        new Blob([bytes])
            .stream()
            .pipeThrough(
                new CompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
INFLATE
============================================================
*/

async function inflate(bytes) {

    if (
        !("DecompressionStream" in window)
    ) {

        throw new Error(
            "This browser does not support DEFLATE decompression."
        );

    }


    const stream =
        new Blob([bytes])
            .stream()
            .pipeThrough(
                new DecompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
BAYER MATRIX
============================================================
*/

/*
 * 4×4 ordered dithering matrix.
 *
 * This produces a Game Boy Camera-like dither pattern.
 */

const BAYER_4 = [

    0,  8,  2, 10,

   12,  4, 14,  6,

    3, 11,  1,  9,

   15,  7, 13,  5

];


/*
============================================================
RESIZE + GRAYSCALE + DITHER
============================================================
*/

function createGBC4Pixels(
    sourceImage,
    width,
    height
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    /*
     * Smooth resizing is intentional here.
     *
     * We want the photographic information to be
     * averaged before converting it into four shades.
     */
    ctx.imageSmoothingEnabled =
        true;


    ctx.drawImage(
        sourceImage,
        0,
        0,
        width,
        height
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const pixels =
        new Uint8Array(
            width *
            height
        );


    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            const index =
                (
                    y * width +
                    x
                ) * 4;


            const r =
                imageData.data[
                    index
                ];


            const g =
                imageData.data[
                    index + 1
                ];


            const b =
                imageData.data[
                    index + 2
                ];


            /*
             * Standard luminance.
             */
            const luminance =
                (
                    0.299 * r +
                    0.587 * g +
                    0.114 * b
                );


            /*
             * Ordered dithering.
             *
             * Convert 0-255 into four shades.
             */
            const threshold =
                (
                    BAYER_4[
                        (
                            y & 3
                        ) * 4 +
                        (
                            x & 3
                        )
                    ] - 7.5
                ) * 4;


            const adjusted =
                Math.max(
                    0,
                    Math.min(
                        255,
                        luminance +
                        threshold
                    )
                );


            let shade;


            if (
                adjusted < 64
            ) {

                shade = 0;

            }
            else if (
                adjusted < 128
            ) {

                shade = 1;

            }
            else if (
                adjusted < 192
            ) {

                shade = 2;

            }
            else {

                shade = 3;

            }


            pixels[
                y * width + x
            ] =
                shade;

        }

    }


    return pixels;

}


/*
============================================================
PACK 2-BIT PIXELS
============================================================
*/

function packPixels(
    pixels
) {

    const output =
        new Uint8Array(
            Math.ceil(
                pixels.length / 4
            )
        );


    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const byteIndex =
            Math.floor(
                i / 4
            );


        const shift =
            6 -
            (
                (
                    i % 4
                ) * 2
            );


        output[
            byteIndex
        ] |=
            pixels[i] <<
            shift;

    }


    return output;

}


/*
============================================================
DELTA ENCODE
============================================================
*/

/*
 * Instead of storing the actual pixel value, store the
 * difference between adjacent pixels.
 *
 * Because values are only 2 bits, this is performed modulo 4.
 *
 * This is especially useful when dithering patterns repeat.
 */

function deltaEncode(
    pixels,
    width
) {

    const output =
        new Uint8Array(
            pixels.length
        );


    let previous =
        0;


    for (
        let y = 0;
        y < pixels.length / width;
        y++
    ) {

        previous =
            0;


        for (
            let x = 0;
            x < width;
            x++
        ) {

            const index =
                y * width + x;


            output[index] =
                (
                    pixels[index] -
                    previous +
                    4
                ) & 3;


            previous =
                pixels[index];

        }

    }


    return output;

}


/*
============================================================
DELTA DECODE
============================================================
*/

function deltaDecode(
    pixels,
    width
) {

    const output =
        new Uint8Array(
            pixels.length
        );


    for (
        let y = 0;
        y < pixels.length / width;
        y++
    ) {

        let previous =
            0;


        for (
            let x = 0;
            x < width;
            x++
        ) {

            const index =
                y * width + x;


            output[index] =
                (
                    previous +
                    pixels[index]
                ) & 3;


            previous =
                output[index];

        }

    }


    return output;

}


/*
============================================================
VERTICAL DELTA
============================================================
*/

function verticalDeltaEncode(
    pixels,
    width,
    height
) {

    const output =
        new Uint8Array(
            pixels.length
        );


    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            const index =
                y * width + x;


            if (
                y === 0
            ) {

                output[index] =
                    pixels[index];

            }
            else {

                output[index] =
                    (
                        pixels[index] -
                        pixels[
                            index - width
                        ] +
                        4
                    ) & 3;

            }

        }

    }


    return output;

}


/*
============================================================
VERTICAL DELTA DECODE
============================================================
*/

function verticalDeltaDecode(
    pixels,
    width,
    height
) {

    const output =
        new Uint8Array(
            pixels.length
        );


    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            const index =
                y * width + x;


            if (
                y === 0
            ) {

                output[index] =
                    pixels[index];

            }
            else {

                output[index] =
                    (
                        pixels[index] +
                        output[
                            index - width
                        ]
                    ) & 3;

            }

        }

    }


    return output;

}


/*
============================================================
CREATE GBC4 RAW
============================================================
*/

function createGBC4Raw(
    width,
    height,
    pixels,
    mode
) {

    /*
     * Header:
     *
     * byte 0 = version
     * byte 1 = width
     * byte 2 = height
     * byte 3 = encoding mode
     *
     * Mode:
     *
     * 0 = packed pixels
     * 1 = horizontal delta
     * 2 = vertical delta
     */

    const packed =
        packPixels(
            pixels
        );


    const raw =
        new Uint8Array(
            4 +
            packed.length
        );


    raw[0] =
        4;


    raw[1] =
        width;


    raw[2] =
        height;


    raw[3] =
        mode;


    raw.set(
        packed,
        4
    );


    return raw;

}


/*
============================================================
ENCODE ONE GBC4 CANDIDATE
============================================================
*/

async function encodeGBC4Candidate(
    sourceImage,
    width,
    height,
    mode
) {

    let pixels =
        createGBC4Pixels(
            sourceImage,
            width,
            height
        );


    /*
     * Apply transform.
     */
    if (
        mode === 1
    ) {

        pixels =
            deltaEncode(
                pixels,
                width
            );

    }
    else if (
        mode === 2
    ) {

        pixels =
            verticalDeltaEncode(
                pixels,
                width,
                height
            );

    }


    const raw =
        createGBC4Raw(
            width,
            height,
            pixels,
            mode
        );


    const compressed =
        await deflate(
            raw
        );


    const encoded =
        GBC4_MAGIC +
        "/" +
        bytesToBase64Url(
            compressed
        );


    return {
        encoded,
        width,
        height,
        mode,
        rawSize: raw.length,
        compressedSize: compressed.length
    };

}


/*
============================================================
ENCODE GBC4
============================================================
*/

async function encodeGBC4(
    sourceImage
) {

    /*
     * Candidate resolutions.
     *
     * These are deliberately much smaller than the original
     * 128×112 / 160×144 image.
     *
     * The image is reconstructed as a larger pixel-art image
     * when displayed.
     */

    const resolutions = [

        [64, 56],

        [56, 49],

        [48, 42],

        [40, 35],

        [32, 28]

    ];


    const candidates = [];


    /*
     * Try every resolution with every predictor.
     */
    for (
        const resolution of resolutions
    ) {

        const width =
            resolution[0];


        const height =
            resolution[1];


        for (
            const mode of [0, 1, 2]
        ) {

            try {

                const candidate =
                    await encodeGBC4Candidate(
                        sourceImage,
                        width,
                        height,
                        mode
                    );


                candidates.push(
                    candidate
                );

            }
            catch (error) {

                console.warn(
                    "GBC4 candidate failed:",
                    width,
                    height,
                    mode,
                    error
                );

            }

        }

    }


    if (
        candidates.length === 0
    ) {

        throw new Error(
            "Could not create a GBC4 image."
        );

    }


    /*
     * Sort by URL length.
     */
    candidates.sort(
        (a, b) =>
            a.encoded.length -
            b.encoded.length
    );


    /*
     * Smallest candidate wins.
     */
    const best =
        candidates[0];


    console.log(
        "GBC4 candidates:"
    );


    for (
        const candidate of candidates
    ) {

        console.log(
            candidate.width +
            "×" +
            candidate.height,
            "mode",
            candidate.mode,
            "→",
            candidate.encoded.length,
            "chars"
        );

    }


    console.log(
        "GBC4 selected:",
        best.width +
        "×" +
        best.height,
        "mode",
        best.mode,
        "URL:",
        best.encoded.length,
        "characters"
    );


    return best;

}


/*
============================================================
DECODE GBC4
============================================================
*/

async function decodeGBC4(
    encoded
) {

    if (
        !encoded.startsWith(
            GBC4_MAGIC + "/"
        )
    ) {

        throw new Error(
            "Invalid GBC4 image."
        );

    }


    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC4_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 4
    ) {

        throw new Error(
            "GBC4 image is too short."
        );

    }


    if (
        raw[0] !== 4
    ) {

        throw new Error(
            "Unsupported GBC4 version."
        );

    }


    const width =
        raw[1];


    const height =
        raw[2];


    const mode =
        raw[3];


    if (
        width < 1 ||
        height < 1 ||
        width > 255 ||
        height > 255
    ) {

        throw new Error(
            "Invalid GBC4 dimensions."
        );

    }


    const packed =
        raw.subarray(
            4
        );


    const expectedLength =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        packed.length !==
        expectedLength
    ) {

        throw new Error(
            "Invalid GBC4 pixel data."
        );

    }


    /*
     * Unpack.
     */
    let pixels =
        new Uint8Array(
            width *
            height
        );


    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const byteIndex =
            Math.floor(
                i / 4
            );


        const shift =
            6 -
            (
                (
                    i % 4
                ) * 2
            );


        pixels[i] =
            (
                packed[
                    byteIndex
                ] >>
                shift
            ) & 3;

    }


    /*
     * Reverse predictor.
     */
    if (
        mode === 1
    ) {

        pixels =
            deltaDecode(
                pixels,
                width
            );

    }
    else if (
        mode === 2
    ) {

        pixels =
            verticalDeltaDecode(
                pixels,
                width,
                height
            );

    }
    else if (
        mode !== 0
    ) {

        throw new Error(
            "Unknown GBC4 encoding mode."
        );

    }


    /*
     * Create display canvas.
     */
    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    /*
     * Classic Game Boy Camera-style palette.
     *
     * The actual source photo is reduced to these
     * four shades before encoding.
     */
    const palette = [

        [255, 255, 255],

        [170, 170, 170],

        [85, 85, 85],

        [0, 0, 0]

    ];


    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const shade =
            pixels[i];


        const colour =
            palette[
                shade
            ];


        const outputOffset =
            i * 4;


        imageData.data[
            outputOffset
        ] =
            colour[0];


        imageData.data[
            outputOffset + 1
        ] =
            colour[1];


        imageData.data[
            outputOffset + 2
        ] =
            colour[2];


        imageData.data[
            outputOffset + 3
        ] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/*
============================================================
DISPLAY CANVAS
============================================================
*/

function displayCanvas(
    canvas
) {

    const imageUrl =
        canvas.toDataURL(
            "image/png"
        );


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "Could not display image."
            );

        };


    photo.src =
        imageUrl;

}


/*
============================================================
LOAD GBC4
============================================================
*/

async function loadGBC4(
    encoded
) {

    const canvas =
        await decodeGBC4(
            encoded
        );


    displayCanvas(
        canvas
    );

}


/*
============================================================
GBC3 DECODER
============================================================
*/

function unpackRow(
    packed,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    for (
        let x = 0;
        x < width;
        x++
    ) {

        const byteIndex =
            Math.floor(
                x / 4
            );


        const shift =
            6 -
            (
                (
                    x % 4
                ) * 2
            );


        row[x] =
            (
                packed[
                    byteIndex
                ] >>
                shift
            ) & 3;

    }


    return row;

}


function decodeRowRLE(
    bytes,
    offset,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    let x = 0;


    while (
        x < width
    ) {

        if (
            offset >= bytes.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 RLE row."
            );

        }


        const token =
            bytes[offset++];


        const shade =
            token >> 6;


        const count =
            (
                token & 63
            ) + 1;


        if (
            x + count > width
        ) {

            throw new Error(
                "GBC3 RLE row exceeds width."
            );

        }


        row.fill(
            shade,
            x,
            x + count
        );


        x += count;

    }


    return {
        row,
        offset
    };

}


/*
============================================================
LOAD GBC3
============================================================
*/

async function loadGBC3(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC3_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC3 image is too short."
        );

    }


    if (
        raw[0] !== 3
    ) {

        throw new Error(
            "Unsupported GBC3 version."
        );

    }


    const dimensionCode =
        raw[1];


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width = 128;
        height = 112;

    }
    else if (
        dimensionCode === 1
    ) {

        width = 160;
        height = 144;

    }
    else {

        throw new Error(
            "Unsupported GBC3 dimensions."
        );

    }


    const palette =
        raw.subarray(
            2,
            14
        );


    const pixels =
        new Uint8Array(
            width *
            height
        );


    let offset =
        14;


    let previousRow =
        null;


    for (
        let y = 0;
        y < height;
        y++
    ) {

        if (
            offset >= raw.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 image."
            );

        }


        const mode =
            raw[offset++];


        if (
            mode === 0
        ) {

            const result =
                decodeRowRLE(
                    raw,
                    offset,
                    width
                );


            offset =
                result.offset;


            pixels.set(
                result.row,
                y * width
            );


            previousRow =
                result.row;

        }

        else if (
            mode === 1
        ) {

            const packedLength =
                Math.ceil(
                    width / 4
                );


            if (
                offset +
                packedLength >
                raw.length
            ) {

                throw new Error(
                    "Unexpected end of GBC3 packed row."
                );

            }


            const packed =
                raw.subarray(
                    offset,
                    offset +
                    packedLength
                );


            offset +=
                packedLength;


            const row =
                unpackRow(
                    packed,
                    width
                );


            pixels.set(
                row,
                y * width
            );


            previousRow =
                row;

        }

        else if (
            mode === 2
        ) {

            if (
                previousRow === null
            ) {

                throw new Error(
                    "GBC3 repeat row has no previous row."
                );

            }


            pixels.set(
                previousRow,
                y * width
            );

        }

        else {

            throw new Error(
                "Unknown GBC3 row mode."
            );

        }

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const shade =
            pixels[i];


        const paletteOffset =
            shade * 3;


        const outputOffset =
            i * 4;


        imageData.data[
            outputOffset
        ] =
            palette[
                paletteOffset
            ];


        imageData.data[
            outputOffset + 1
        ] =
            palette[
                paletteOffset + 1
            ];


        imageData.data[
            outputOffset + 2
        ] =
            palette[
                paletteOffset + 2
            ];


        imageData.data[
            outputOffset + 3
        ] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    displayCanvas(
        canvas
    );

}


/*
============================================================
GBC1 DECODER
============================================================
*/

async function loadGBC1(
    encoded
) {

    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC1_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC1 image is too short."
        );

    }


    if (
        raw[0] !== 1
    ) {

        throw new Error(
            "Unsupported GBC1 version."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width = 128;
        height = 112;

    }
    else if (
        dimensionCode === 1
    ) {

        width = 160;
        height = 144;

    }
    else {

        throw new Error(
            "Unsupported GBC1 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    const palette =
        raw.subarray(
            2,
            14
        );


    let pixelData =
        raw.subarray(
            14
        );


    function xorDecode(
        bytes
    ) {

        const output =
            new Uint8Array(
                bytes.length
            );


        let previous =
            0;


        for (
            let i = 0;
            i < bytes.length;
            i++
        ) {

            output[i] =
                bytes[i] ^
                previous;


            previous =
                output[i];

        }


        return output;

    }


    function rleDecode(
        bytes
    ) {

        const output = [];


        let i = 0;


        while (
            i < bytes.length
        ) {

            const value =
                bytes[i++];


            if (
                value !== 255
            ) {

                output.push(
                    value
                );


                continue;

            }


            if (
                i + 1 >=
                bytes.length
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            const marker =
                bytes[i++];


            const count =
                bytes[i++];


            if (
                marker !== 0 ||
                count === 0
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            if (
                count === 1
            ) {

                output.push(
                    255
                );

            }

            else {

                for (
                    let n = 0;
                    n < count;
                    n++
                ) {

                    output.push(
                        0
                    );

                }

            }

        }


        return new Uint8Array(
            output
        );

    }


    if (
        codec === 1
    ) {

        pixelData =
            xorDecode(
                pixelData
            );

    }

    else if (
        codec === 2
    ) {

        pixelData =
            xorDecode(
                rleDecode(
                    pixelData
                )
            );

    }

    else if (
        codec !== 0
    ) {

        throw new Error(
            "Unsupported GBC1 codec."
        );

    }


    const expectedLength =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        pixelData.length !==
        expectedLength
    ) {

        throw new Error(
            "Invalid GBC1 pixel data."
        );

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    let pixel =
        0;


    for (
        let i = 0;
        i < pixelData.length;
        i++
    ) {

        const packed =
            pixelData[i];


        for (
            let shift = 6;
            shift >= 0 &&
            pixel <
                width * height;
            shift -= 2
        ) {

            const shade =
                (
                    packed >>
                    shift
                ) & 3;


            const paletteOffset =
                shade * 3;


            const outputOffset =
                pixel * 4;


            imageData.data[
                outputOffset
            ] =
                palette[
                    paletteOffset
                ];


            imageData.data[
                outputOffset + 1
            ] =
                palette[
                    paletteOffset + 1
                ];


            imageData.data[
                outputOffset + 2
            ] =
                palette[
                    paletteOffset + 2
                ];


            imageData.data[
                outputOffset + 3
            ] =
                255;


            pixel++;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    displayCanvas(
        canvas
    );

}


/*
============================================================
LEGACY PNG
============================================================
*/

function loadLegacyPNG(
    encoded
) {

    let base64 =
        encoded
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            showError(
                "The image data in this URL could not be decoded."
            );

        };


    photo.src =
        "data:image/png;base64," +
        base64;

}


/*
============================================================
LOAD HASH
============================================================
*/

async function loadImageFromHash() {

    const encoded =
        window.location.hash.substring(
            1
        );


    if (!encoded) {

        upload.style.display =
            "flex";


        photo.style.display =
            "none";


        return;

    }


    errorBox.style.display =
        "none";


    try {

        if (
            encoded.startsWith(
                GBC4_MAGIC + "/"
            )
        ) {

            await loadGBC4(
                encoded
            );


            return;

        }


        if (
            encoded.startsWith(
                GBC3_MAGIC + "/"
            )
        ) {

            await loadGBC3(
                encoded
            );


            return;

        }


        if (
            encoded.startsWith(
                GBC1_MAGIC + "/"
            )
        ) {

            await loadGBC1(
                encoded
            );


            return;

        }


        loadLegacyPNG(
            encoded
        );

    }

    catch (error) {

        console.error(
            error
        );


        upload.style.display =
            "none";


        photo.style.display =
            "none";


        showError(
            error.message ||
            "Invalid image URL."
        );

    }

}


/*
============================================================
UPLOAD
============================================================
*/

fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files[0];


        if (!file) {

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function () {

                const image =
                    new Image();


                image.onload =
                    async function () {

                        try {

                            /*
                             * Encode as GBC4.
                             *
                             * Unlike GBC3, arbitrary photographic
                             * source images are accepted.
                             */

                            const result =
                                await encodeGBC4(
                                    image
                                );


                            /*
                             * Put encoded image in hash.
                             */
                            window.location.hash =
                                result.encoded;


                            /*
                             * Display immediately.
                             */
                            await loadImageFromHash();


                            console.log(
                                "--------------------------------"
                            );


                            console.log(
                                "GBC4 RESULT"
                            );


                            console.log(
                                "Resolution:",
                                result.width +
                                "×" +
                                result.height
                            );


                            console.log(
                                "Mode:",
                                result.mode
                            );


                            console.log(
                                "Compressed:",
                                result.compressedSize,
                                "bytes"
                            );


                            console.log(
                                "Hash:",
                                result.encoded.length,
                                "characters"
                            );


                            console.log(
                                "Complete URL:",
                                window.location.href.length,
                                "characters"
                            );


                            console.log(
                                "--------------------------------"
                            );

                        }

                        catch (error) {

                            console.error(
                                error
                            );


                            showError(
                                error.message ||
                                "Could not encode image."
                            );

                        }

                    };


                image.onerror =
                    function () {

                        showError(
                            "Could not read the selected image."
                        );

                    };


                image.src =
                    reader.result;

            };


        reader.onerror =
            function () {

                showError(
                    "Could not read the selected file."
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);


/*
============================================================
HASH CHANGE
============================================================
*/

window.addEventListener(
    "hashchange",
    function () {

        loadImageFromHash();

    }
);


/*
============================================================
COPY URL
============================================================
*/

photo.addEventListener(
    "click",
    async function () {

        const url =
            window.location.href;


        try {

            await navigator.clipboard.writeText(
                url
            );


            copiedBox.style.display =
                "block";


            setTimeout(
                function () {

                    copiedBox.style.display =
                        "none";

                },
                1500
            );

        }

        catch (error) {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";


            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    "copy"
                );


                copiedBox.style.display =
                    "block";


                setTimeout(
                    function () {

                        copiedBox.style.display =
                            "none";

                    },
                    1500
                );

            }

            catch (e) {

                showError(
                    "Could not copy URL."
                );

            }


            document.body.removeChild(
                textarea
            );

        }

    }
);


/*
============================================================
START
============================================================
*/

loadImageFromHash();

</script>
