<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Game Boy Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}


body {

    display: flex;

    align-items: center;
    justify-content: center;

}


/*
============================================================
IMAGE VIEWER
============================================================
*/

#photo {

    display: none;

    width: 98vw;
    height: 98vh;

    object-fit: contain;

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    image-rendering: pixelated;
    image-rendering: crisp-edges;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;

}


/*
============================================================
UPLOAD SCREEN
============================================================
*/

#upload {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 15px;

    color: #fff;

    text-align: center;

}


#upload label {

    display: inline-block;

    padding: 14px 22px;

    background: #222;

    border: 1px solid #555;

    border-radius: 8px;

    font-family: sans-serif;

    font-size: 16px;

    cursor: pointer;

}


#upload label:hover {

    background: #333;

}


#file {

    display: none;

}


/*
============================================================
ERROR
============================================================
*/

#error {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    max-width: 90vw;

    padding: 10px 15px;

    background:
        rgba(150, 0, 0, 0.9);

    color: white;

    font-family: monospace;

    font-size: 13px;

    border-radius: 6px;

    text-align: center;

    z-index: 10;

}


/*
============================================================
COPIED MESSAGE
============================================================
*/

#copied {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    padding: 10px 15px;

    background:
        rgba(0, 0, 0, 0.85);

    color: white;

    font-family: sans-serif;

    font-size: 14px;

    border-radius: 6px;

    z-index: 10;

}

</style>

</head>


<body>


<div id="upload">

    <label for="file">
        Choose Game Boy Camera Photo
    </label>

    <input
        id="file"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

</div>


<img
    id="photo"
    alt="Game Boy Camera Photo"
>


<div id="error"></div>


<div id="copied">
    URL copied!
</div>


<script>

/*
################################################################
#
# GBC3
#
# GAME BOY CAMERA COMPACT URL FORMAT
#
################################################################
#
# URL:
#
#   #GBC3/<Base64URL>
#
#
# DESIGN
#
# Each row is encoded independently.
#
# For every row the encoder chooses:
#
#   RLE
#       OR
#   packed 2-bit pixels
#
# If a row is identical to the previous row:
#
#   REPEAT
#
# The complete binary stream is then DEFLATE compressed.
#
#
# RLE TOKEN
#
#   bits 7-6 = shade
#   bits 5-0 = run length - 1
#
# Therefore:
#
#   00xxxxxx = shade 0
#   01xxxxxx = shade 1
#   10xxxxxx = shade 2
#   11xxxxxx = shade 3
#
# Maximum run per token = 64 pixels.
#
#
# ROW MODES
#
#   0 = RLE
#   1 = PACKED
#   2 = REPEAT PREVIOUS ROW
#
#
# PACKED
#
# Four pixels per byte.
#
# Pixel order:
#
#   bits 7-6 = pixel 0
#   bits 5-4 = pixel 1
#   bits 3-2 = pixel 2
#   bits 1-0 = pixel 3
#
################################################################
*/


const GBC1_MAGIC =
    "GBC1";


const GBC3_MAGIC =
    "GBC3";


const GBC_VERSION =
    3;


/*
============================================================
DOM
============================================================
*/

const photo =
    document.getElementById(
        "photo"
    );


const upload =
    document.getElementById(
        "upload"
    );


const fileInput =
    document.getElementById(
        "file"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const copiedBox =
    document.getElementById(
        "copied"
    );


/*
============================================================
ERROR
============================================================
*/

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/*
============================================================
BASE64URL ENCODE
============================================================
*/

function bytesToBase64Url(bytes) {

    let binary = "";

    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );


        binary +=
            String.fromCharCode(
                ...chunk
            );

    }


    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


/*
============================================================
BASE64URL DECODE
============================================================
*/

function base64UrlToBytes(string) {

    let base64 =
        string
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/*
============================================================
DEFLATE
============================================================
*/

async function deflate(bytes) {

    if (
        !("CompressionStream" in window)
    ) {

        throw new Error(
            "This browser does not support DEFLATE compression."
        );

    }


    const stream =
        new Blob([bytes])
            .stream()
            .pipeThrough(
                new CompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
INFLATE
============================================================
*/

async function inflate(bytes) {

    if (
        !("DecompressionStream" in window)
    ) {

        throw new Error(
            "This browser does not support DEFLATE decompression."
        );

    }


    const stream =
        new Blob([bytes])
            .stream()
            .pipeThrough(
                new DecompressionStream(
                    "deflate"
                )
            );


    const buffer =
        await new Response(stream)
            .arrayBuffer();


    return new Uint8Array(
        buffer
    );

}


/*
============================================================
PACK ONE ROW
============================================================
*/

function packRow(
    row,
    width
) {

    const packed =
        new Uint8Array(
            Math.ceil(
                width / 4
            )
        );


    for (
        let x = 0;
        x < width;
        x++
    ) {

        const pixel =
            row[x];


        const byteIndex =
            Math.floor(
                x / 4
            );


        const shift =
            6 -
            (
                (x % 4) *
                2
            );


        packed[byteIndex] |=
            pixel << shift;

    }


    return packed;

}


/*
============================================================
UNPACK ONE ROW
============================================================
*/

function unpackRow(
    packed,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    for (
        let x = 0;
        x < width;
        x++
    ) {

        const byteIndex =
            Math.floor(
                x / 4
            );


        const shift =
            6 -
            (
                (x % 4) *
                2
            );


        row[x] =
            (
                packed[byteIndex] >>
                shift
            ) & 3;

    }


    return row;

}


/*
============================================================
RLE ENCODE ONE ROW
============================================================
*/

function encodeRowRLE(row) {

    const output = [];


    let x = 0;


    while (
        x < row.length
    ) {

        const shade =
            row[x];


        let count =
            1;


        while (
            x + count < row.length &&
            row[x + count] === shade &&
            count < 64
        ) {

            count++;

        }


        /*
         * One byte contains:
         *
         * shade = top 2 bits
         * count = bottom 6 bits
         */
        output.push(
            (
                shade << 6
            ) |
            (
                count - 1
            )
        );


        x += count;

    }


    return new Uint8Array(
        output
    );

}


/*
============================================================
DECODE ONE RLE ROW
============================================================
*/

function decodeRowRLE(
    bytes,
    offset,
    width
) {

    const row =
        new Uint8Array(
            width
        );


    let x = 0;


    while (
        x < width
    ) {

        if (
            offset >= bytes.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 RLE row."
            );

        }


        const token =
            bytes[offset++];


        const shade =
            token >> 6;


        const count =
            (
                token & 63
            ) + 1;


        if (
            x + count > width
        ) {

            throw new Error(
                "GBC3 RLE row exceeds width."
            );

        }


        row.fill(
            shade,
            x,
            x + count
        );


        x += count;

    }


    return {
        row,
        offset
    };

}


/*
============================================================
ROWS → GBC3 STREAM
============================================================
*/

function createGBC3Rows(
    rows,
    width
) {

    const output = [];


    let previousRow =
        null;


    for (
        let y = 0;
        y < rows.length;
        y++
    ) {

        const row =
            rows[y];


        /*
         * ----------------------------------------------------
         * IDENTICAL ROW
         * ----------------------------------------------------
         *
         * If the complete row is identical to the previous
         * row, use one byte instead of encoding the row again.
         */
        if (
            previousRow !== null
        ) {

            let identical =
                true;


            for (
                let x = 0;
                x < width;
                x++
            ) {

                if (
                    row[x] !==
                    previousRow[x]
                ) {

                    identical =
                        false;

                    break;

                }

            }


            if (
                identical
            ) {

                /*
                 * Mode 2 = repeat previous row
                 */
                output.push(2);


                previousRow =
                    row;


                continue;

            }

        }


        /*
         * ----------------------------------------------------
         * CREATE BOTH REPRESENTATIONS
         * ----------------------------------------------------
         */

        const rle =
            encodeRowRLE(
                row
            );


        const packed =
            packRow(
                row,
                width
            );


        /*
         * ----------------------------------------------------
         * CHOOSE SMALLEST
         * ----------------------------------------------------
         *
         * RLE has a one-byte mode prefix.
         *
         * Packed also has a one-byte mode prefix.
         */
        if (
            rle.length + 1 <
            packed.length + 1
        ) {

            /*
             * Mode 0 = RLE
             */
            output.push(0);


            for (
                const byte of rle
            ) {

                output.push(byte);

            }

        }
        else {

            /*
             * Mode 1 = packed 2-bit
             */
            output.push(1);


            for (
                const byte of packed
            ) {

                output.push(byte);

            }

        }


        previousRow =
            row;

    }


    return new Uint8Array(
        output
    );

}


/*
============================================================
GBC3 HEADER
============================================================
*/

function createGBC3Raw(
    width,
    height,
    palette,
    rowData
) {

    let dimensionCode;


    if (
        width === 128 &&
        height === 112
    ) {

        dimensionCode =
            0;

    }
    else if (
        width === 160 &&
        height === 144
    ) {

        dimensionCode =
            1;

    }
    else {

        throw new Error(
            "Game Boy Camera images must be " +
            "128×112 or 160×144."
        );

    }


    /*
     * Header:
     *
     * byte 0 = version
     * byte 1 = dimensions
     * bytes 2-13 = palette
     */
    const raw =
        new Uint8Array(
            14 +
            rowData.length
        );


    raw[0] =
        GBC_VERSION;


    raw[1] =
        dimensionCode;


    /*
     * Palette.
     */
    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const colour =
            palette[i];


        const offset =
            2 +
            i * 3;


        raw[offset] =
            (
                colour >> 16
            ) & 255;


        raw[offset + 1] =
            (
                colour >> 8
            ) & 255;


        raw[offset + 2] =
            colour & 255;

    }


    raw.set(
        rowData,
        14
    );


    return raw;

}


/*
============================================================
PACK IMAGE INTO FOUR SHADES
============================================================
*/

function convertToFourShades(
    imageData,
    width,
    height
) {

    const pixels =
        imageData.data;


    const frequency =
        new Map();


    /*
     * Count exact colours.
     */
    for (
        let i = 0;
        i < pixels.length;
        i += 4
    ) {

        const r =
            pixels[i];


        const g =
            pixels[i + 1];


        const b =
            pixels[i + 2];


        const a =
            pixels[i + 3];


        if (
            a !== 255
        ) {

            throw new Error(
                "Image contains transparency."
            );

        }


        const colour =
            (
                (r << 16) |
                (g << 8) |
                b
            ) >>> 0;


        frequency.set(
            colour,
            (
                frequency.get(
                    colour
                ) || 0
            ) + 1
        );

    }


    const colours =
        Array.from(
            frequency.keys()
        );


    /*
     * We require a genuine four-shade image.
     */
    if (
        colours.length > 4
    ) {

        throw new Error(
            "This image contains " +
            colours.length +
            " colours.\n\n" +
            "For lossless GBC3 encoding, the image " +
            "must contain four colours or fewer."
        );

    }


    /*
     * Most common first.
     */
    colours.sort(
        (a, b) =>
            frequency.get(b) -
            frequency.get(a)
    );


    const colourMap =
        new Map();


    for (
        let i = 0;
        i < colours.length;
        i++
    ) {

        colourMap.set(
            colours[i],
            i
        );

    }


    /*
     * Pad palette.
     */
    while (
        colours.length < 4
    ) {

        colours.push(
            colours.length > 0
                ? colours[
                    colours.length - 1
                ]
                : 0
        );

    }


    /*
     * Convert every pixel to a 2-bit shade.
     */
    const shadePixels =
        new Uint8Array(
            width *
            height
        );


    for (
        let i = 0;
        i < width * height;
        i++
    ) {

        const offset =
            i * 4;


        const colour =
            (
                (pixels[offset] << 16) |
                (pixels[offset + 1] << 8) |
                pixels[offset + 2]
            ) >>> 0;


        shadePixels[i] =
            colourMap.get(
                colour
            );

    }


    return {
        pixels: shadePixels,
        palette: colours
    };

}


/*
============================================================
ENCODE GBC3
============================================================
*/

async function encodeGBC3(
    imageData,
    width,
    height
) {

    const converted =
        convertToFourShades(
            imageData,
            width,
            height
        );


    const pixels =
        converted.pixels;


    const palette =
        converted.palette;


    /*
     * Build rows.
     */
    const rows = [];


    for (
        let y = 0;
        y < height;
        y++
    ) {

        rows.push(
            pixels.subarray(
                y * width,
                (
                    y + 1
                ) * width
            )
        );

    }


    /*
     * Adaptive row stream.
     */
    const rowData =
        createGBC3Rows(
            rows,
            width
        );


    /*
     * Header + row stream.
     */
    const raw =
        createGBC3Raw(
            width,
            height,
            palette,
            rowData
        );


    /*
     * DEFLATE.
     */
    const compressed =
        await deflate(
            raw
        );


    /*
     * Create URL.
     */
    const encoded =
        GBC3_MAGIC +
        "/" +
        bytesToBase64Url(
            compressed
        );


    /*
     * Return some useful diagnostics.
     */
    return {
        encoded,
        rawSize: raw.length,
        compressedSize: compressed.length
    };

}


/*
============================================================
DECODE GBC3
============================================================
*/

async function decodeGBC3(
    encoded
) {

    if (
        !encoded.startsWith(
            GBC3_MAGIC + "/"
        )
    ) {

        throw new Error(
            "Invalid GBC3 image."
        );

    }


    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC3_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC3 image is too short."
        );

    }


    if (
        raw[0] !==
        GBC_VERSION
    ) {

        throw new Error(
            "Unsupported GBC3 version."
        );

    }


    /*
     * Dimensions.
     */
    const dimensionCode =
        raw[1];


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width =
            128;

        height =
            112;

    }
    else if (
        dimensionCode === 1
    ) {

        width =
            160;

        height =
            144;

    }
    else {

        throw new Error(
            "Unsupported GBC3 dimensions."
        );

    }


    /*
     * Palette.
     */
    const palette =
        raw.subarray(
            2,
            14
        );


    /*
     * Output pixels.
     */
    const pixels =
        new Uint8Array(
            width *
            height
        );


    let offset =
        14;


    let previousRow =
        null;


    /*
     * Decode every row.
     */
    for (
        let y = 0;
        y < height;
        y++
    ) {

        if (
            offset >= raw.length
        ) {

            throw new Error(
                "Unexpected end of GBC3 image."
            );

        }


        const mode =
            raw[offset++];


        /*
         * ----------------------------------------------------
         * RLE
         * ----------------------------------------------------
         */
        if (
            mode === 0
        ) {

            const result =
                decodeRowRLE(
                    raw,
                    offset,
                    width
                );


            offset =
                result.offset;


            pixels.set(
                result.row,
                y * width
            );


            previousRow =
                result.row;

        }


        /*
         * ----------------------------------------------------
         * PACKED
         * ----------------------------------------------------
         */
        else if (
            mode === 1
        ) {

            const packedLength =
                Math.ceil(
                    width / 4
                );


            if (
                offset +
                packedLength >
                raw.length
            ) {

                throw new Error(
                    "Unexpected end of packed GBC3 row."
                );

            }


            const packed =
                raw.subarray(
                    offset,
                    offset +
                    packedLength
                );


            offset +=
                packedLength;


            const row =
                unpackRow(
                    packed,
                    width
                );


            pixels.set(
                row,
                y * width
            );


            previousRow =
                row;

        }


        /*
         * ----------------------------------------------------
         * REPEAT PREVIOUS ROW
         * ----------------------------------------------------
         */
        else if (
            mode === 2
        ) {

            if (
                previousRow === null
            ) {

                throw new Error(
                    "GBC3 repeat row has no previous row."
                );

            }


            pixels.set(
                previousRow,
                y * width
            );

        }


        else {

            throw new Error(
                "Unknown GBC3 row mode: " +
                mode
            );

        }

    }


    /*
     * Create display canvas.
     */
    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    /*
     * Convert 2-bit pixels back into RGB.
     */
    for (
        let i = 0;
        i < pixels.length;
        i++
    ) {

        const shade =
            pixels[i];


        const paletteOffset =
            shade * 3;


        const outputOffset =
            i * 4;


        imageData.data[
            outputOffset
        ] =
            palette[
                paletteOffset
            ];


        imageData.data[
            outputOffset + 1
        ] =
            palette[
                paletteOffset + 1
            ];


        imageData.data[
            outputOffset + 2
        ] =
            palette[
                paletteOffset + 2
            ];


        imageData.data[
            outputOffset + 3
        ] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/*
============================================================
DISPLAY CANVAS
============================================================
*/

function displayCanvas(
    canvas
) {

    /*
     * PNG is created only in memory for display.
     *
     * It is NOT placed in the URL.
     */
    const imageUrl =
        canvas.toDataURL(
            "image/png"
        );


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "Could not display image."
            );

        };


    photo.src =
        imageUrl;

}


/*
============================================================
LOAD GBC3
============================================================
*/

async function loadGBC3(
    encoded
) {

    const canvas =
        await decodeGBC3(
            encoded
        );


    displayCanvas(
        canvas
    );

}


/*
============================================================
LEGACY GBC1 LOADER
============================================================
*/

async function loadGBC1(
    encoded
) {

    /*
     * This decoder is compatible with the GBC1
     * format from the previous version.
     */
    const compressed =
        base64UrlToBytes(
            encoded.substring(
                GBC1_MAGIC.length + 1
            )
        );


    const raw =
        await inflate(
            compressed
        );


    if (
        raw.length < 14
    ) {

        throw new Error(
            "GBC1 image is too short."
        );

    }


    if (
        raw[0] !== 1
    ) {

        throw new Error(
            "Unsupported GBC1 version."
        );

    }


    const flags =
        raw[1];


    const dimensionCode =
        flags & 3;


    let width;
    let height;


    if (
        dimensionCode === 0
    ) {

        width = 128;
        height = 112;

    }
    else if (
        dimensionCode === 1
    ) {

        width = 160;
        height = 144;

    }
    else {

        throw new Error(
            "Unsupported GBC1 dimensions."
        );

    }


    const codec =
        (
            flags >> 2
        ) & 3;


    const palette =
        raw.subarray(
            2,
            14
        );


    let pixelData =
        raw.subarray(
            14
        );


    /*
     * GBC1 XOR decode.
     */
    function xorDecode(
        bytes
    ) {

        const output =
            new Uint8Array(
                bytes.length
            );


        let previous =
            0;


        for (
            let i = 0;
            i < bytes.length;
            i++
        ) {

            output[i] =
                bytes[i] ^
                previous;


            previous =
                output[i];

        }


        return output;

    }


    /*
     * GBC1 RLE decode.
     */
    function rleDecode(
        bytes
    ) {

        const output = [];


        let i = 0;


        while (
            i < bytes.length
        ) {

            const value =
                bytes[i++];


            if (
                value !== 255
            ) {

                output.push(
                    value
                );


                continue;

            }


            if (
                i + 1 >=
                bytes.length
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            const marker =
                bytes[i++];


            const count =
                bytes[i++];


            if (
                marker !== 0 ||
                count === 0
            ) {

                throw new Error(
                    "Invalid GBC1 RLE."
                );

            }


            if (
                count === 1
            ) {

                output.push(
                    255
                );

            }
            else {

                for (
                    let n = 0;
                    n < count;
                    n++
                ) {

                    output.push(
                        0
                    );

                }

            }

        }


        return new Uint8Array(
            output
        );

    }


    if (
        codec === 1
    ) {

        pixelData =
            xorDecode(
                pixelData
            );

    }
    else if (
        codec === 2
    ) {

        pixelData =
            xorDecode(
                rleDecode(
                    pixelData
                )
            );

    }
    else if (
        codec !== 0
    ) {

        throw new Error(
            "Unsupported GBC1 codec."
        );

    }


    const expectedLength =
        Math.ceil(
            width *
            height /
            4
        );


    if (
        pixelData.length !==
        expectedLength
    ) {

        throw new Error(
            "Invalid GBC1 pixel data."
        );

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    let pixel =
        0;


    for (
        let i = 0;
        i < pixelData.length;
        i++
    ) {

        const packed =
            pixelData[i];


        for (
            let shift = 6;
            shift >= 0 &&
            pixel <
                width * height;
            shift -= 2
        ) {

            const shade =
                (
                    packed >>
                    shift
                ) & 3;


            const paletteOffset =
                shade * 3;


            const outputOffset =
                pixel * 4;


            imageData.data[
                outputOffset
            ] =
                palette[
                    paletteOffset
                ];


            imageData.data[
                outputOffset + 1
            ] =
                palette[
                    paletteOffset + 1
                ];


            imageData.data[
                outputOffset + 2
            ] =
                palette[
                    paletteOffset + 2
                ];


            imageData.data[
                outputOffset + 3
            ] =
                255;


            pixel++;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    displayCanvas(
        canvas
    );

}


/*
============================================================
LEGACY PNG BASE64 LOADER
============================================================
*/

function loadLegacyPNG(
    encoded
) {

    let base64 =
        encoded
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    photo.onload =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "block";

        };


    photo.onerror =
        function () {

            upload.style.display =
                "none";


            photo.style.display =
                "none";


            showError(
                "The image data in this URL could not be decoded."
            );

        };


    photo.src =
        "data:image/png;base64," +
        base64;

}


/*
============================================================
LOAD IMAGE FROM HASH
============================================================
*/

async function loadImageFromHash() {

    const encoded =
        window.location.hash.substring(
            1
        );


    if (!encoded) {

        upload.style.display =
            "flex";


        photo.style.display =
            "none";


        return;

    }


    errorBox.style.display =
        "none";


    try {

        /*
         * GBC3
         */
        if (
            encoded.startsWith(
                GBC3_MAGIC + "/"
            )
        ) {

            await loadGBC3(
                encoded
            );


            return;

        }


        /*
         * GBC1
         */
        if (
            encoded.startsWith(
                GBC1_MAGIC + "/"
            )
        ) {

            await loadGBC1(
                encoded
            );


            return;

        }


        /*
         * Old PNG/Base64 URL.
         */
        loadLegacyPNG(
            encoded
        );

    }
    catch (error) {

        console.error(
            error
        );


        upload.style.display =
            "none";


        photo.style.display =
            "none";


        showError(
            error.message ||
            "Invalid image URL."
        );

    }

}


/*
============================================================
UPLOAD IMAGE
============================================================
*/

fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files[0];


        if (!file) {

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function () {

                const image =
                    new Image();


                image.onload =
                    async function () {

                        try {

                            /*
                             * Only accept native GBC
                             * dimensions.
                             */
                            const width =
                                image.naturalWidth;


                            const height =
                                image.naturalHeight;


                            if (
                                !(
                                    (
                                        width === 128 &&
                                        height === 112
                                    ) ||
                                    (
                                        width === 160 &&
                                        height === 144
                                    )
                                )
                            ) {

                                throw new Error(
                                    "Game Boy Camera images must be " +
                                    "128×112 or 160×144 pixels."
                                );

                            }


                            /*
                             * Canvas.
                             */
                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.imageSmoothingEnabled =
                                false;


                            ctx.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            /*
                             * Exact source pixels.
                             */
                            const imageData =
                                ctx.getImageData(
                                    0,
                                    0,
                                    width,
                                    height
                                );


                            /*
                             * Encode GBC3.
                             */
                            const result =
                                await encodeGBC3(
                                    imageData,
                                    width,
                                    height
                                );


                            /*
                             * Update hash.
                             *
                             * This automatically causes a
                             * hashchange event.
                             */
                            window.location.hash =
                                result.encoded;


                            /*
                             * Load immediately.
                             *
                             * No refresh required.
                             */
                            await loadImageFromHash();


                            /*
                             * Log compression information
                             * for testing.
                             */
                            console.log(
                                "GBC3 raw:",
                                result.rawSize,
                                "bytes"
                            );


                            console.log(
                                "GBC3 compressed:",
                                result.compressedSize,
                                "bytes"
                            );


                            console.log(
                                "GBC3 URL:",
                                result.encoded.length,
                                "characters"
                            );


                            console.log(
                                "Complete URL:",
                                window.location.href.length,
                                "characters"
                            );

                        }
                        catch (error) {

                            console.error(
                                error
                            );


                            showError(
                                error.message ||
                                "Could not encode Game Boy Camera image."
                            );

                        }

                    };


                image.onerror =
                    function () {

                        showError(
                            "Could not read the selected image."
                        );

                    };


                image.src =
                    reader.result;

            };


        reader.onerror =
            function () {

                showError(
                    "Could not read the selected file."
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);


/*
============================================================
BROWSER BACK / FORWARD
============================================================
*/

window.addEventListener(
    "hashchange",
    function () {

        loadImageFromHash();

    }
);


/*
============================================================
CLICK IMAGE → COPY URL
============================================================
*/

photo.addEventListener(
    "click",
    async function () {

        const url =
            window.location.href;


        try {

            await navigator.clipboard.writeText(
                url
            );


            copiedBox.style.display =
                "block";


            setTimeout(
                function () {

                    copiedBox.style.display =
                        "none";

                },
                1500
            );

        }
        catch (error) {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";


            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    "copy"
                );


                copiedBox.style.display =
                    "block";


                setTimeout(
                    function () {

                        copiedBox.style.display =
                            "none";

                    },
                    1500
                );

            }
            catch (e) {

                showError(
                    "Could not copy URL."
                );

            }


            document.body.removeChild(
                textarea
            );

        }

    }
);


/*
============================================================
START
============================================================
*/

loadImageFromHash();

</script>
